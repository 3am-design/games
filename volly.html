<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Games - 貓咪排球</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overscroll-behavior-y: none; background:#000; font-family:'Inter','Noto Sans TC',sans-serif; color:#fff; height:100%; height:-webkit-fill-available; overflow:hidden; margin:0; touch-action:none; }
    :root { --app-height: 100dvh; --board-w: min(92vw, 800px); }
    .app-container { height:var(--app-height); display:flex; flex-direction:column; overflow:hidden; }
    button { -webkit-tap-highlight-color:transparent; outline:none; touch-action:manipulation; }
    .key-base { transition:opacity .2s ease-out, transform .12s ease-out; }
    .key-base:active { opacity:.55; transform:scale(.98); transition:none; }
    .icon-white { filter:brightness(0) invert(1); }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .animate-fade-in { animation:fadeIn .25s ease-out; }
    @keyframes pulseGlow { 0%,100%{opacity:.65; transform:scale(1)} 50%{opacity:1; transform:scale(1.04)} }
    .game-board-container { width:var(--board-w); max-width:800px; border:2px solid #334155; border-radius:14px; overflow:hidden; position:relative; background:linear-gradient(180deg,#0f172a 0%,#020617 58%,#000 100%); box-shadow:0 0 30px rgba(0,0,0,.85) inset; margin:0 auto; touch-action:none; user-select:none; -webkit-user-select:none; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:2/1; touch-action:none; }
    .touch-zone { position:absolute; inset:0; z-index:15; pointer-events:none; }
    .touch-hint { position:absolute; bottom:12px; font-size:10px; letter-spacing:.16em; color:rgba(255,255,255,.28); text-transform:uppercase; pointer-events:none; user-select:none; }
    .touch-hint.left { left:16px; }
    .touch-hint.right { right:16px; }
    .jump-indicator { position:absolute; right:18px; bottom:36px; width:58px; height:58px; border-radius:999px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.62); font-size:26px; pointer-events:none; }
    .jump-indicator.active { border-color:#00e5ff; background:rgba(0,229,255,.18); color:#fff; animation:pulseGlow .22s ease-out; }
    @media (max-width:1023px){ :root{ --board-w:min(94vw, calc(var(--app-height) * .92), 800px); } .game-board-container{border-radius:12px;} }
    @media (max-height:720px) and (max-width:1023px){ :root{ --board-w:min(94vw, calc(var(--app-height) * .78), 760px); } }
  </style>
</head>
<body class="bg-black selection:bg-white/30">
  <div id="app" class="app-container"></div>
  <script>
    const MODES={
      EASY:{label:'新手 EASY',desc:'AI 移動慢少少，適合熟習手感',aiSpeed:6.5,aiDelay:18,aiError:36,aiJumpChance:.48,target:7},
      NORMAL:{label:'標準 NORMAL',desc:'AI 會預判落點，節奏適中',aiSpeed:8.7,aiDelay:7,aiError:20,aiJumpChance:.68,target:11},
      HARD:{label:'困難 HARD',desc:'AI 反應快，會主動跳扣',aiSpeed:10.2,aiDelay:2,aiError:9,aiJumpChance:.86,target:11},
      PVP:{label:'雙人 PVP',desc:'同一部裝置，鍵盤左右互搏',aiSpeed:9.2,aiDelay:0,aiError:0,aiJumpChance:1,target:11}
    };
    let state={isMenuOpen:true,mode:'NORMAL',pendingMode:'NORMAL',score1:0,score2:0,targetScore:11,isGameOver:false,winner:null,serving:1,isPaused:false};
    const GAME_W=800,GAME_H=400,GRAVITY=.58,GROUND_Y=374,NET_X=GAME_W/2,NET_H=78,NET_W=12,MAX_BALL_SPEED_X=17,MAX_BALL_SPEED_Y=18;
    let ball,p1,p2,keys={},animationFrameId=null,lastTimestamp=0;
    const mobileInput={active:false,pointerId:null,targetX:null,jumpActive:false,lastJumpAt:0};
    const isMobileView=()=>window.innerWidth<1024;
    const updateViewport=()=>{const vv=window.visualViewport;const vh=Math.floor((vv&&vv.height)||window.innerHeight||document.documentElement.clientHeight||800);document.documentElement.style.setProperty('--app-height',`${vh}px`);};
    window.addEventListener('resize',updateViewport); if(window.visualViewport) window.visualViewport.addEventListener('resize',updateViewport); window.addEventListener('orientationchange',()=>setTimeout(updateViewport,100)); updateViewport();
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)); const sign=v=>v<0?-1:1;
    const resetEntities=(server)=>{ball={x:server===1?GAME_W*.28:GAME_W*.72,y:GAME_H*.34,vx:server===1?2.2:-2.2,vy:-2.5,r:19,color:'#ffea00',history:[],isSmash:false,smashColor:'',lastHitBy:null};p1={x:GAME_W*.25,y:GROUND_Y,vx:0,vy:0,r:48,speed:9.4,jump:-15.5,color:'#00e5ff',eyeX:1,isPlayer:true,targetX:GAME_W*.25,groundedGrace:0};p2={x:GAME_W*.75,y:GROUND_Y,vx:0,vy:0,r:48,speed:MODES[state.mode].aiSpeed,jump:-15.2,color:'#f50057',eyeX:-1,isPlayer:state.mode==='PVP',targetX:GAME_W*.75,delayTimer:0,groundedGrace:0};mobileInput.targetX=p1.x;};
    window.initGame=(selectedMode=state.pendingMode)=>{state.mode=selectedMode;state.pendingMode=selectedMode;state.isMenuOpen=false;state.score1=0;state.score2=0;state.isGameOver=false;state.winner=null;state.serving=1;state.isPaused=false;state.targetScore=MODES[state.mode].target;resetEntities(state.serving);renderApp();startGameLoop();};
    const startGameLoop=()=>{if(animationFrameId)cancelAnimationFrame(animationFrameId);lastTimestamp=performance.now();const loop=time=>{if(state.isMenuOpen)return;const dt=Math.min(32,time-lastTimestamp)/16.67;lastTimestamp=time;updatePhysics(dt);drawGame();animationFrameId=requestAnimationFrame(loop);};animationFrameId=requestAnimationFrame(loop);};
    const jump=cat=>{if(cat.y>=GROUND_Y-.5||cat.groundedGrace>0){cat.vy=cat.jump;cat.groundedGrace=0;}};
    const applyPlayerInput=(cat,dt)=>{let intent=0;if(keys.a||keys.A||keys.ArrowLeft)intent-=1;if(keys.d||keys.D||keys.ArrowRight)intent+=1;if(keys.w||keys.W||keys.ArrowUp||keys[' '])jump(cat);if(isMobileView()&&mobileInput.active&&mobileInput.targetX!==null){const diff=mobileInput.targetX-cat.x;intent=Math.abs(diff)>8?sign(diff):0;}const airFactor=cat.y<GROUND_Y?.82:1;const targetVx=intent*cat.speed*airFactor;cat.vx+=(targetVx-cat.vx)*.48;if(Math.abs(cat.vx)<.08)cat.vx=0;};
    const updateCatPosition=(cat,leftBound,rightBound,dt)=>{cat.vy+=GRAVITY*dt;cat.x+=cat.vx*dt;cat.y+=cat.vy*dt;if(cat.y>=GROUND_Y){cat.y=GROUND_Y;cat.vy=0;cat.groundedGrace=5;}else cat.groundedGrace=Math.max(0,cat.groundedGrace-dt);cat.x=clamp(cat.x,leftBound+cat.r,rightBound-cat.r);};
    const predictLandingX=b=>{let sim={x:b.x,y:b.y,vx:b.vx,vy:b.vy};for(let i=0;i<160;i++){sim.vy+=GRAVITY;sim.x+=sim.vx;sim.y+=sim.vy;if(sim.x-b.r<0){sim.x=b.r;sim.vx*=-.85;}if(sim.x+b.r>GAME_W){sim.x=GAME_W-b.r;sim.vx*=-.85;}if(sim.y+b.r>=GROUND_Y)return sim.x;}return sim.x;};
    const aiLogic=(ai,b,dt)=>{const cfg=MODES[state.mode];ai.delayTimer+=dt;if(ai.delayTimer>=cfg.aiDelay){if(b.x>NET_X-24||b.vx>0){const landing=predictLandingX(b);const error=(Math.random()*2-1)*cfg.aiError;ai.targetX=clamp(landing+error,NET_X+ai.r+8,GAME_W-ai.r-8);const ballNear=Math.abs(ai.x-b.x)<(state.mode==='HARD'?112:92);const ballFalling=b.vy>-1;const ballHeightGood=b.y>108&&b.y<315;if(ballNear&&ballFalling&&ballHeightGood&&ai.y>=GROUND_Y-.5&&Math.random()<cfg.aiJumpChance){jump(ai);if(state.mode==='HARD')ai.targetX=clamp(b.x-18,NET_X+ai.r+8,GAME_W-ai.r-8);}}else ai.targetX=GAME_W-145;ai.delayTimer=0;}const diff=ai.targetX-ai.x;const intent=Math.abs(diff)>9?sign(diff):0;const airFactor=ai.y<GROUND_Y?.82:1;const targetVx=intent*ai.speed*airFactor;ai.vx+=(targetVx-ai.vx)*.42;if(Math.abs(ai.vx)<.08)ai.vx=0;};
    const updatePhysics=dt=>{if(state.isGameOver||state.isPaused)return;applyPlayerInput(p1,dt);if(p2.isPlayer){let intent=0;if(keys.j||keys.J)intent-=1;if(keys.l||keys.L)intent+=1;if(keys.i||keys.I)jump(p2);const airFactor=p2.y<GROUND_Y?.82:1;p2.vx+=(intent*p2.speed*airFactor-p2.vx)*.48;}else aiLogic(p2,ball,dt);updateCatPosition(p1,0,NET_X-NET_W/2,dt);updateCatPosition(p2,NET_X+NET_W/2,GAME_W,dt);ball.vy+=GRAVITY*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx=clamp(ball.vx,-MAX_BALL_SPEED_X,MAX_BALL_SPEED_X);ball.vy=clamp(ball.vy,-MAX_BALL_SPEED_Y,MAX_BALL_SPEED_Y);ball.history.push({x:ball.x,y:ball.y});if(ball.history.length>8)ball.history.shift();if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-.86;ball.isSmash=false;}if(ball.x+ball.r>GAME_W){ball.x=GAME_W-ball.r;ball.vx*=-.86;ball.isSmash=false;}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-.86;ball.isSmash=false;}collideNet();checkCatCollision(p1,ball);checkCatCollision(p2,ball);if(ball.y+ball.r>=GROUND_Y+5){checkCatCollision(p1,ball,true);checkCatCollision(p2,ball,true);if(ball.y+ball.r>=GROUND_Y+5){ball.y=GROUND_Y-ball.r;state.isPaused=true;ball.isSmash=false;if(ball.x<NET_X){state.score2++;state.serving=2;}else{state.score1++;state.serving=1;}updateScoreDisplay();if(state.score1>=state.targetScore){state.isGameOver=true;state.winner='P1';renderApp();}else if(state.score2>=state.targetScore){state.isGameOver=true;state.winner='P2';renderApp();}else setTimeout(()=>{resetEntities(state.serving);state.isPaused=false;},850);}}};
    const collideNet=()=>{const netLeft=NET_X-NET_W/2,netRight=NET_X+NET_W/2,netTop=GROUND_Y-NET_H;if(ball.x+ball.r>netLeft&&ball.x-ball.r<netRight&&ball.y+ball.r>netTop){if(ball.y<netTop+16){ball.y=netTop-ball.r;ball.vy=-Math.abs(ball.vy)*.78;ball.vx+=ball.x<NET_X?-1.2:1.2;}else if(ball.x<NET_X){ball.x=netLeft-ball.r;ball.vx=-Math.abs(ball.vx)*.78;}else{ball.x=netRight+ball.r;ball.vx=Math.abs(ball.vx)*.78;}ball.isSmash=false;}};
    const checkCatCollision=(cat,b,grace=false)=>{let dx=b.x-cat.x,dy=b.y-cat.y,dist=Math.sqrt(dx*dx+dy*dy)||.0001;const hitBoost=grace?20:13;const allowedLower=cat.y+(grace?18:10);if(dist<cat.r+b.r+hitBoost&&b.y<=allowedLower){let nx=dx/dist,ny=dy/dist;if(ny>-.12)ny=-.12;const overlap=(cat.r+b.r+hitBoost)-dist;b.x+=nx*overlap*.78;b.y+=ny*overlap*.78;const horizontalIntent=Math.abs(cat.vx)>1.5?sign(cat.vx):cat.eyeX;const forwardHit=(cat.eyeX===1&&nx>-.15)||(cat.eyeX===-1&&nx<.15);const airborne=cat.y<GROUND_Y-2;const movingForward=(cat.eyeX===1&&cat.vx>1.2)||(cat.eyeX===-1&&cat.vx<-1.2);let bounceForce=13.8;let newVx=nx*bounceForce+cat.vx*.58;let newVy=ny*bounceForce+(cat.vy<0?cat.vy*.55:0);newVy=Math.min(newVy,-5.2);if(airborne&&movingForward&&forwardHit){newVx+=horizontalIntent*4.2;newVy=Math.min(newVy*1.04,-7.2);b.isSmash=true;b.smashColor=cat.color;}else b.isSmash=false;b.vx=clamp(newVx,-MAX_BALL_SPEED_X,MAX_BALL_SPEED_X);b.vy=clamp(newVy,-MAX_BALL_SPEED_Y,MAX_BALL_SPEED_Y);b.lastHitBy=cat===p1?1:2;}};
    const drawGame=()=>{const canvas=document.getElementById('gameCanvas');if(!canvas||!ball||!p1||!p2)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,GAME_W,GAME_H);const grd=ctx.createLinearGradient(0,0,0,GAME_H);grd.addColorStop(0,'#0f172a');grd.addColorStop(.62,'#020617');grd.addColorStop(1,'#000');ctx.fillStyle=grd;ctx.fillRect(0,0,GAME_W,GAME_H);ctx.strokeStyle='rgba(148,163,184,.16)';ctx.lineWidth=1;ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(NET_X,0);ctx.lineTo(NET_X,GROUND_Y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#111827';ctx.fillRect(0,GROUND_Y,GAME_W,GAME_H-GROUND_Y);ctx.fillStyle='#334155';ctx.fillRect(0,GROUND_Y,GAME_W,4);ctx.save();ctx.shadowColor='#94a3b8';ctx.shadowBlur=8;ctx.fillStyle='#94a3b8';ctx.fillRect(NET_X-NET_W/2,GROUND_Y-NET_H,NET_W,NET_H);ctx.beginPath();ctx.arc(NET_X,GROUND_Y-NET_H,NET_W/2+1,0,Math.PI*2);ctx.fill();ctx.restore();drawBall(ctx);drawCat(ctx,p1);drawCat(ctx,p2);};
    const drawBall=ctx=>{if(ball.isSmash){ctx.save();for(let i=0;i<ball.history.length;i++){const pos=ball.history[i];const alpha=(i+1)/ball.history.length*.38;ctx.globalAlpha=alpha;ctx.fillStyle=ball.smashColor;ctx.beginPath();ctx.arc(pos.x,pos.y,ball.r*(.55+alpha*.55),0,Math.PI*2);ctx.fill();}ctx.restore();ctx.shadowColor=ball.smashColor;ctx.fillStyle=ball.smashColor;}else{ctx.shadowColor=ball.color;ctx.fillStyle=ball.color;}ctx.save();ctx.shadowBlur=ball.isSmash?28:16;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(ball.x-5,ball.y-5,4.5,0,Math.PI*2);ctx.fill();ctx.restore();};
    const drawCat=(ctx,cat)=>{ctx.save();ctx.shadowBlur=20;ctx.shadowColor=cat.color;ctx.fillStyle=cat.color;ctx.beginPath();ctx.moveTo(cat.x-32,cat.y-24);ctx.lineTo(cat.x-22,cat.y-58);ctx.lineTo(cat.x-6,cat.y-41);ctx.lineTo(cat.x+6,cat.y-41);ctx.lineTo(cat.x+22,cat.y-58);ctx.lineTo(cat.x+32,cat.y-24);ctx.fill();ctx.beginPath();ctx.arc(cat.x,cat.y,cat.r,Math.PI,0,false);ctx.fill();ctx.shadowBlur=0;const eyeOffsetX=18*cat.eyeX,eyeOffsetY=cat.y<GROUND_Y?-27:-16;ctx.fillStyle='white';ctx.beginPath();ctx.arc(cat.x+eyeOffsetX,cat.y+eyeOffsetY,12,0,Math.PI*2);ctx.fill();const dx=ball.x-(cat.x+eyeOffsetX),dy=ball.y-(cat.y+eyeOffsetY),dist=Math.sqrt(dx*dx+dy*dy)||1;const pupilX=cat.x+eyeOffsetX+(dx/dist)*4,pupilY=cat.y+eyeOffsetY+(dy/dist)*4;ctx.fillStyle='black';ctx.beginPath();ctx.ellipse(pupilX,pupilY,3.5,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();const dir=cat.eyeX,wx=cat.x+29*dir,wy=cat.y-8;ctx.moveTo(wx,wy-4);ctx.lineTo(wx+13*dir,wy-10);ctx.moveTo(wx+2*dir,wy+2);ctx.lineTo(wx+15*dir,wy+2);ctx.moveTo(wx,wy+8);ctx.lineTo(wx+13*dir,wy+14);ctx.stroke();ctx.restore();};
    window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();});window.addEventListener('keyup',e=>{keys[e.key]=false;});
    const getCanvasPoint=(clientX,clientY)=>{const canvas=document.getElementById('gameCanvas');if(!canvas)return null;const rect=canvas.getBoundingClientRect();return{x:(clientX-rect.left)/rect.width*GAME_W,y:(clientY-rect.top)/rect.height*GAME_H,rect};};
    const handlePointerDown=e=>{if(!isMobileView()||state.isMenuOpen||state.isGameOver)return;if(e.target.closest&&e.target.closest('button, a, #menu-layer'))return;const point=getCanvasPoint(e.clientX,e.clientY);if(!point)return;if(point.x>GAME_W*.53){mobileInput.jumpActive=true;mobileInput.lastJumpAt=performance.now();jump(p1);updateJumpIndicator(true);}else{mobileInput.active=true;mobileInput.pointerId=e.pointerId;mobileInput.targetX=clamp(point.x,p1.r,NET_X-NET_W/2-p1.r);}e.preventDefault();};
    const handlePointerMove=e=>{if(!isMobileView()||!mobileInput.active||e.pointerId!==mobileInput.pointerId)return;const point=getCanvasPoint(e.clientX,e.clientY);if(!point)return;mobileInput.targetX=clamp(point.x,p1.r,NET_X-NET_W/2-p1.r);e.preventDefault();};
    const handlePointerUp=e=>{if(mobileInput.active&&e.pointerId===mobileInput.pointerId){mobileInput.active=false;mobileInput.pointerId=null;}if(mobileInput.jumpActive){mobileInput.jumpActive=false;setTimeout(()=>updateJumpIndicator(false),120);}};
    const updateJumpIndicator=active=>{const el=document.getElementById('jump-indicator');if(!el)return;if(active)el.classList.add('active');else el.classList.remove('active');};
    window.addEventListener('pointerdown',handlePointerDown,{passive:false});window.addEventListener('pointermove',handlePointerMove,{passive:false});window.addEventListener('pointerup',handlePointerUp,{passive:true});window.addEventListener('pointercancel',handlePointerUp,{passive:true});
    window.openMenu=()=>{state.pendingMode=state.mode;state.isMenuOpen=true;renderApp();};window.closeMenu=()=>{state.isMenuOpen=false;renderApp();startGameLoop();};window.setMode=mode=>{state.pendingMode=mode;updateModeMenuDOM();};
    const updateModeMenuDOM=()=>{Object.keys(MODES).forEach(key=>{const btn=document.getElementById(`btn-mode-${key}`),desc=document.getElementById(`mode-desc-${key}`);if(!btn)return;const active=state.pendingMode===key;btn.className=`w-full text-left p-4 lg:p-5 rounded-xl key-base ${active?'bg-white text-black font-bold':'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900'} flex flex-col gap-1`;if(desc)desc.className=`${active?'text-neutral-600':'text-neutral-500'} text-[11px] lg:text-[13px]`;});};
    const updateScoreDisplay=()=>{const s1=document.getElementById('score1-display'),s2=document.getElementById('score2-display');if(s1)s1.innerText=state.score1;if(s2)s2.innerText=state.score2;};
    const getMenuHTML=()=>{const inProgress=state.score1>0||state.score2>0;const backToLobbyHTML=`<a href="index.html" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] hover:text-white transition-colors pt-1 lg:pt-1.5 flex items-center gap-1.5 key-base" style="text-decoration:none;"><img src="./assets/gamehub.svg" alt="Hub" class="h-[12px] opacity-70 icon-white" onerror="this.style.display='none'"> 返回遊戲大堂</a>`;const closeBtnHTML=inProgress&&!state.isGameOver?`<button onclick="window.closeMenu()" class="text-white text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-neutral-300 transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white" onerror="this.outerHTML='✕'"></button>`:`<div class="h-[12px] lg:h-[15px] pt-1 lg:pt-1.5"></div>`;let modesHTML='';Object.keys(MODES).forEach(key=>{const m=MODES[key],active=state.pendingMode===key;modesHTML+=`<button id="btn-mode-${key}" onclick="window.setMode('${key}')" class="w-full text-left p-4 lg:p-5 rounded-xl key-base ${active?'bg-white text-black font-bold':'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900'} flex flex-col gap-1"><div class="text-[14px] lg:text-[16px] tracking-[0.1em] uppercase flex items-center">${m.label}</div><div id="mode-desc-${key}" class="${active?'text-neutral-600':'text-neutral-500'} text-[11px] lg:text-[13px]">${m.desc}</div></button>`;});return `<div id="menu-layer" class="fixed inset-0 z-50 bg-black flex flex-col overflow-y-auto animate-fade-in"><header class="flex-none pt-6 pb-2 px-5 lg:px-12 flex items-center justify-between z-30 w-full shrink-0">${backToLobbyHTML}${closeBtnHTML}</header><div class="flex-1 flex flex-col items-center justify-center gap-6 pb-10 px-6 w-full mt-4 lg:mt-0 max-w-[400px] mx-auto"><div class="flex flex-col items-center justify-center gap-3 mb-4"><img src="./assets/Logo.svg" alt="LOGO" class="h-[22px] lg:h-[28px] object-contain opacity-90 icon-white" onerror="this.style.display='none'"><div class="text-white tracking-[0.4em] text-[15px] lg:text-[18px] font-light opacity-60">貓咪排球</div></div><div class="w-full flex flex-col gap-3"><div class="text-neutral-500 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase text-center mb-2">MODE 模式選擇</div>${modesHTML}</div><div class="w-full max-w-[340px] lg:max-w-[440px] mt-6"><button onclick="window.initGame(state.pendingMode)" class="w-full bg-[#00e5ff] hover:bg-cyan-400 active:bg-cyan-500 text-black py-4 lg:py-5 rounded-lg font-bold tracking-[0.15em] text-[13px] lg:text-[16px] uppercase transition-colors key-base">${inProgress&&!state.isGameOver?'RESTART 重新開始':'開始新遊戲 START'}</button></div></div></div>`;};
    function renderApp(){const appDiv=document.getElementById('app');if(state.isMenuOpen){appDiv.innerHTML=getMenuHTML();return;}const modeLabel=MODES[state.mode].label;let overlayHTML='';if(state.isGameOver){const winText=state.winner==='P1'?'<span class="text-[#00e5ff]">P1 藍貓</span> 獲勝!':(state.mode==='PVP'?'<span class="text-[#f50057]">P2 粉貓</span> 獲勝!':'<span class="text-[#f50057]">電腦 AI</span> 獲勝!');overlayHTML=`<div class="absolute inset-0 z-40 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center animate-fade-in"><div class="text-4xl lg:text-5xl font-black text-white tracking-widest mb-4 drop-shadow-lg text-center leading-tight">${winText}</div><div class="text-neutral-300 tracking-widest uppercase mb-8 font-medium">率先達到 ${state.targetScore} 分</div><button onclick="window.initGame(state.mode)" class="px-8 py-3 bg-[#00e5ff] text-black font-bold tracking-[0.1em] rounded-full hover:bg-cyan-400 transition-colors shadow-lg">再玩一次 TRY AGAIN</button></div>`;}const mobileHint=isMobileView()?`<div class="touch-zone"><div class="touch-hint left">Drag left side</div><div class="jump-indicator" id="jump-indicator">↑</div><div class="touch-hint right">Tap to jump</div></div>`:'';const instruction=state.mode==='PVP'?'P1: W/A/D 或方向鍵　|　P2: I/J/L':(isMobileView()?'左半邊拖動移動 / 右半邊 Tap 跳':'W/A/D 或方向鍵移動跳躍');appDiv.innerHTML=`<div class="w-full h-full bg-black flex flex-col overflow-hidden relative"><header class="flex-none pt-4 lg:pt-8 pb-2 px-4 lg:px-12 flex items-center justify-between z-30 w-full shrink-0"><div class="flex items-center"><img src="./assets/Logo.svg" alt="GAMES" class="h-[20px] lg:h-[28px] object-contain icon-white" onerror="this.outerHTML='<span class=\'text-white font-bold text-xl tracking-widest\'>🎮 GAMES</span>'"></div><div class="flex items-center gap-5"><button onclick="window.initGame(state.mode)" class="opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/back.svg" alt="RESTART" class="h-[15px] lg:h-[20px] icon-white" onerror="this.outerHTML='↶'"></button><button onclick="window.openMenu()" class="opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/setting.svg" alt="SET" class="h-[15px] lg:h-[20px] icon-white" onerror="this.outerHTML='⚙'"></button></div></header><section class="flex-none px-4 lg:px-12 w-full max-w-[920px] mx-auto mt-4 lg:mt-5"><div class="flex items-end justify-between gap-4"><div class="text-[13px] lg:text-[16px] text-white font-medium tracking-[0.15em] leading-relaxed"><span class="text-neutral-400">貓咪排球</span><br>${modeLabel}<br><span class="text-neutral-500 text-[11px] lg:text-[13px]">先到 ${state.targetScore} 分</span></div><div class="flex gap-6 lg:gap-10 text-right"><div><div class="text-[#00e5ff] text-[10px] lg:text-[12px] uppercase tracking-widest font-bold mb-1">P1</div><div id="score1-display" class="text-white font-mono text-[34px] lg:text-[44px] tracking-widest leading-none drop-shadow-[0_0_8px_rgba(0,229,255,0.5)]">${state.score1}</div></div><div><div class="text-[#f50057] text-[10px] lg:text-[12px] uppercase tracking-widest font-bold mb-1">${state.mode==='PVP'?'P2':'AI'}</div><div id="score2-display" class="text-white font-mono text-[34px] lg:text-[44px] tracking-widest leading-none drop-shadow-[0_0_8px_rgba(245,0,87,0.5)]">${state.score2}</div></div></div></div></section><main class="flex-1 w-full max-w-[920px] mx-auto flex flex-col justify-center relative z-10 px-3 lg:px-12 pb-6 lg:pb-10 min-h-0"><div class="game-board-container"><canvas id="gameCanvas" width="${GAME_W}" height="${GAME_H}"></canvas>${mobileHint}${overlayHTML}</div><div class="text-neutral-500 text-[10px] lg:text-[12px] uppercase tracking-widest w-full text-center mt-4">${instruction}</div></main></div>`;setTimeout(drawGame,0);}
    window.onload=()=>{renderApp();};
  </script>
</body>
</html>
