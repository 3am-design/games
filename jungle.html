<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Games - 鬥獸棋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          colors: {
            'c4-red': '#ef4444',
            'c4-red-border': '#b91c1c',
            'c4-white': '#ffffff',
            'c4-white-border': '#d4d4d8',
            'c4-board': '#000000',
            'c4-board-border': '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    
    @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-thinking { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* --- 移動動畫 --- */
    @keyframes moveAnim { 
        0% { transform: scale(1.1); z-index: 10; } 
        100% { transform: scale(1); z-index: 1; } 
    }
    .anim-move { animation: moveAnim 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

    /* --- 擲先後 3D 硬幣動畫 --- */
    .coin-scene { perspective: 800px; width: 100px; height: 100px; }
    @media (min-width: 1024px) { .coin-scene { width: 120px; height: 120px; } }
    .coin-wrapper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
    .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Noto Sans TC', sans-serif; font-size: 2.25rem; border: 4px solid; }
    @media (min-width: 1024px) { .coin-face { font-size: 3rem; } }
    
    /* 調整 Coin 樣式符合紅圈白字/白圈白字 */
    .coin-front { background: #111; color: #fff; border-color: #ef4444; transform: rotateY(0deg); }
    .coin-back { background: #111; color: #fff; border-color: #fff; transform: rotateY(180deg); }

    .coin-face::before { content: ''; position: absolute; inset: 10%; border: 3px solid; border-radius: 50%; opacity: 0.4; pointer-events: none; }
    .coin-face::after { content: ''; position: absolute; inset: 32%; border: 1px solid; border-radius: 50%; opacity: 0.3; pointer-events: none; }
    .coin-front::before, .coin-front::after { border-color: #ef4444; }
    .coin-back::before, .coin-back::after { border-color: #ffffff; }

    @keyframes flipToRed {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(1800deg) scale(1.4); }
      100% { transform: rotateY(3600deg) scale(1); }
    }
    @keyframes flipToWhite {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(1890deg) scale(1.4); }
      100% { transform: rotateY(3780deg) scale(1); }
    }
    .anim-flip-red { animation: flipToRed 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .anim-flip-white { animation: flipToWhite 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes fadeInDelayed {
      0%, 75% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-in-delayed { animation: fadeInDelayed 2.2s ease-out forwards; }

    html, body { 
      overscroll-behavior-y: none; 
      background-color: #000000; 
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      color: #ffffff;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      margin: 0;
      touch-action: manipulation;
    }
    
    .app-container { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    button { -webkit-tap-highlight-color: transparent; outline: none; touch-action: manipulation; }
    svg { -webkit-tap-highlight-color: transparent; }

    .key-base { transition: background-color 0.2s ease-out, color 0.2s ease-out, border-color 0.2s, opacity 0.2s; }
    .key-base:active { opacity: 0.5; transition: none; }
    
    .icon-white { filter: brightness(0) invert(1); }
    .icon-hint-active { filter: brightness(0) saturate(100%) invert(48%) sepia(90%) saturate(3362%) hue-rotate(206deg) brightness(102%) contrast(94%); }
  

    /* --- Mobile layout guard: prevent board / panels from overflowing browser chrome --- */
    :root { --app-height: 100dvh; }
    .app-container { height: var(--app-height); }

    @media (max-width: 767px) {
      html, body { height: var(--app-height); overflow: hidden; }

      .jungle-screen {
        height: var(--app-height);
        min-height: 0;
        overflow: hidden;
      }

      .jungle-header {
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: 4px;
      }

      .jungle-header img { max-height: 18px; }
      .jungle-header-actions { gap: 14px; }

      .jungle-meta {
        position: static !important;
        padding: 0 16px;
        margin-top: 0;
        margin-bottom: 2px;
        z-index: 20;
      }

      .jungle-meta > div {
        font-size: 10px;
        line-height: 1.45;
        letter-spacing: 0.12em;
      }

      .jungle-main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      .jungle-board-section {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
      }

      .jungle-board-wrap {
        width: min(88vw, calc((var(--app-height) - 300px) * 0.70));
        min-width: 220px;
        max-width: 360px;
        padding: 0;
        margin: 0 auto;
      }

      .jungle-board-svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: calc(var(--app-height) - 300px);
      }

      .jungle-side-panel {
        flex: 0 0 auto;
        width: 100%;
        padding: 0 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        background: #000;
      }

      .jungle-status-wrap {
        margin: 6px 0 8px 0;
        padding: 0;
        height: auto;
      }

      .jungle-status-wrap > div {
        min-height: 48px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .jungle-player-area {
        padding-bottom: 0;
      }

      .jungle-player-cards {
        padding-left: 0;
        padding-right: 0;
        gap: 8px;
      }

      .jungle-player-card {
        padding-top: 10px;
        padding-bottom: 10px;
        min-height: 46px;
      }

      .jungle-legend {
        margin-top: 12px;
        margin-bottom: 0;
        gap: 28px;
      }
    }

    @media (max-width: 390px) {
      .jungle-board-wrap {
        width: min(86vw, calc((var(--app-height) - 292px) * 0.69));
        min-width: 210px;
      }
      .jungle-board-svg { max-height: calc(var(--app-height) - 292px); }
      .jungle-header-actions { gap: 12px; }
    }

  </style>
</head>
<body class="bg-black selection:bg-white/30">

  <div id="app" class="app-container"></div>

  <script>

    const updateAppHeight = () => {
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    };
    updateAppHeight();
    window.addEventListener('resize', updateAppHeight);
    window.addEventListener('orientationchange', () => setTimeout(updateAppHeight, 120));

    const AI_NAMES = ['獅王', '虎將', '飛豹', '雪狼', '狂犬', '靈貓', '飛鼠', '巨象'];
    const ANIMALS = { 1: '鼠', 2: '貓', 3: '狗', 4: '狼', 5: '豹', 6: '虎', 7: '獅', 8: '象' };
    const COLS = 7;
    const ROWS = 9;

    const isWater = (x, y) => ((x === 1 || x === 2) || (x === 4 || x === 5)) && (y >= 3 && y <= 5);
    const isTrap = (x, y, color) => {
        if (color === 'R') return (y === 0 && (x === 2 || x === 4)) || (y === 1 && x === 3);
        if (color === 'W') return (y === 8 && (x === 2 || x === 4)) || (y === 7 && x === 3);
        return false;
    };
    const isDen = (x, y, color) => {
        if (color === 'R') return x === 3 && y === 0;
        if (color === 'W') return x === 3 && y === 8;
        return false;
    };

    const cloneState = (state) => JSON.parse(JSON.stringify(state));

    let gameState = null;
    let historyStack = [];
    let isMenuOpen = true;
    let menuJustOpened = true;
    let isRecordOpen = false;
    let isRuleOpen = false;
    let matchHistory = []; 
    let selectedHistoryMatch = null;
    
    let isHintMode = false;
    let currentHints = [];

    let settings = {
      mode: 'PvE', aiDifficulty: 5, firstMove: 'PLAYER', playerColor: 'R', player1Name: '', player2Name: ''
    };
    let pendingSettings = cloneState(settings);

    const loadHistory = () => {
      try {
        const saved = localStorage.getItem('jungle_history_v2');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) matchHistory = parsed;
        }
      } catch (e) { matchHistory = []; }
    };

    const saveHistory = () => {
      try { localStorage.setItem('jungle_history_v2', JSON.stringify(matchHistory)); } catch (e) {}
    };

    const recordFinishedGame = () => {
      if (!gameState || !gameState.winner) return;
      const newMatchRecord = {
        id: Date.now(), timestamp: new Date().toLocaleString(),
        settings: cloneState(settings), gameLog: cloneState(gameState.gameLog), winner: gameState.winner
      };
      matchHistory.unshift(newMatchRecord); 
      if (matchHistory.length > 50) matchHistory.pop(); 
      saveHistory();
    };

    const getInitialBoard = () => {
      let b = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
      const add = (y, x, owner, rank) => b[y][x] = {owner, rank};
      // 紅方 (Top 邏輯座標)
      add(0, 0, 'R', 7); add(0, 6, 'R', 6); add(1, 1, 'R', 3); add(1, 5, 'R', 2);
      add(2, 0, 'R', 1); add(2, 2, 'R', 5); add(2, 4, 'R', 4); add(2, 6, 'R', 8);
      // 白方 (Bottom 邏輯座標)
      add(8, 6, 'W', 7); add(8, 0, 'W', 6); add(7, 5, 'W', 3); add(7, 1, 'W', 2);
      add(6, 6, 'W', 1); add(6, 4, 'W', 5); add(6, 2, 'W', 4); add(6, 0, 'W', 8);
      return b;
    };

    // --- 鬥獸棋核心邏輯 ---
    const checkValidMove = (board, fx, fy, tx, ty, color) => {
        const piece = board[fy][fx];
        if (!piece || piece.owner !== color) return false;
        
        if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return false;
        if (isDen(tx, ty, color)) return false;

        const targetPiece = board[ty][tx];
        if (targetPiece && targetPiece.owner === color) return false;

        const dx = Math.abs(tx - fx);
        const dy = Math.abs(ty - fy);

        let isBasicMove = (dx === 1 && dy === 0) || (dx === 0 && dy === 1);
        
        let isJumpMove = false;
        if (!isBasicMove && (piece.rank === 6 || piece.rank === 7)) {
            if (dy === 0 && dx === 3 && (fy === 3 || fy === 4 || fy === 5)) {
                if ((fx === 0 && tx === 3) || (fx === 3 && tx === 0) || (fx === 3 && tx === 6) || (fx === 6 && tx === 3)) {
                    isJumpMove = true;
                    const minX = Math.min(fx, tx);
                    for (let x = minX + 1; x < minX + 3; x++) {
                        if (board[fy][x] !== null) return false;
                    }
                }
            } else if (dx === 0 && dy === 4 && (fx === 1 || fx === 2 || fx === 4 || fx === 5)) {
                if ((fy === 2 && ty === 6) || (fy === 6 && ty === 2)) {
                    isJumpMove = true;
                    const minY = Math.min(fy, ty);
                    for (let y = minY + 1; y < minY + 4; y++) {
                        if (board[y][fx] !== null) return false;
                    }
                }
            }
        }

        if (!isBasicMove && !isJumpMove) return false;

        if (isWater(tx, ty)) {
            if (piece.rank !== 1) return false; 
        }

        if (targetPiece) {
            const oppColor = color === 'R' ? 'W' : 'R';
            if (isTrap(tx, ty, color)) return true;

            if (piece.rank === 1 && targetPiece.rank === 1) {
                if (isWater(fx, fy) !== isWater(tx, ty)) return false; 
            }

            if (piece.rank === 1 && targetPiece.rank === 8 && !isWater(fx, fy)) return true;
            if (piece.rank === 8 && targetPiece.rank === 1) return false;
            if (piece.rank < targetPiece.rank) return false;
        }

        return true;
    };

    const getAllValidMoves = (board, color) => {
        let moves = [];
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (board[y][x] && board[y][x].owner === color) {
                    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                    if (board[y][x].rank === 6 || board[y][x].rank === 7) {
                        dirs.push([3, 0], [-3, 0], [0, 4], [0, -4]);
                    }

                    for (let [dx, dy] of dirs) {
                        let tx = x + dx, ty = y + dy;
                        if (checkValidMove(board, x, y, tx, ty, color)) {
                            moves.push({ fx: x, fy: y, tx: tx, ty: ty });
                        }
                    }
                }
            }
        }
        return moves;
    };

    const applyMove = (board, move) => {
        const targetPiece = board[move.ty][move.tx];
        board[move.ty][move.tx] = board[move.fy][move.fx];
        board[move.fy][move.fx] = null;
        return targetPiece;
    };

    // --- AI 邏輯 (Alpha-Beta Minimax) ---
    const evaluateBoard = (board, color) => {
        let score = 0;
        const oppColor = color === 'R' ? 'W' : 'R';
        const rankScores = {1:10, 2:20, 3:30, 4:40, 5:50, 6:60, 7:70, 8:80};

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const p = board[y][x];
                if (!p) continue;
                let val = rankScores[p.rank];
                
                const targetDenY = p.owner === 'R' ? 8 : 0;
                const targetDenX = 3;
                const dist = Math.abs(x - targetDenX) + Math.abs(y - targetDenY);
                val += (15 - dist) * 2; 

                if (p.owner === color) score += val;
                else score -= val;
            }
        }
        return score;
    };

    const minimax = (board, depth, alpha, beta, isMax, color, oppColor) => {
        if (board[0][3] && board[0][3].owner === 'W') return isMax ? -99999 + depth : -99999 + depth;
        if (board[8][3] && board[8][3].owner === 'R') return isMax ? 99999 - depth : 99999 - depth;
        
        if (depth === 0) return evaluateBoard(board, color);

        const currentTurnColor = isMax ? color : oppColor;
        const moves = getAllValidMoves(board, currentTurnColor);
        
        if (moves.length === 0) return isMax ? -90000 : 90000; 

        moves.sort((a, b) => {
            let scoreA = board[a.ty][a.tx] ? board[a.ty][a.tx].rank : 0;
            let scoreB = board[b.ty][b.tx] ? board[b.ty][b.tx].rank : 0;
            return scoreB - scoreA;
        });

        if (isMax) {
            let maxEval = -Infinity;
            for (let m of moves) {
                const captured = board[m.ty][m.tx];
                board[m.ty][m.tx] = board[m.fy][m.fx];
                board[m.fy][m.fx] = null;
                let ev = minimax(board, depth - 1, alpha, beta, false, color, oppColor);
                board[m.fy][m.fx] = board[m.ty][m.tx];
                board[m.ty][m.tx] = captured;
                maxEval = Math.max(maxEval, ev);
                alpha = Math.max(alpha, ev);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let m of moves) {
                const captured = board[m.ty][m.tx];
                board[m.ty][m.tx] = board[m.fy][m.fx];
                board[m.fy][m.fx] = null;
                let ev = minimax(board, depth - 1, alpha, beta, true, color, oppColor);
                board[m.fy][m.fx] = board[m.ty][m.tx];
                board[m.ty][m.tx] = captured;
                minEval = Math.min(minEval, ev);
                beta = Math.min(beta, ev);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    };

    const calculateAIMove = () => {
        const color = gameState.turn;
        const oppColor = color === 'R' ? 'W' : 'R';
        const validMoves = getAllValidMoves(gameState.board, color);
        if (validMoves.length === 0) return null;

        let depth = 2; 
        if (settings.aiDifficulty >= 10) depth = 3;
        else if (settings.aiDifficulty <= 3) depth = 1;

        let bestScore = -Infinity;
        let bestMoves = [];

        let randomness = settings.aiDifficulty <= 6 ? 0.3 : 0.05;
        if (Math.random() < randomness) {
            return validMoves[Math.floor(Math.random() * validMoves.length)];
        }

        for (let m of validMoves) {
            const captured = gameState.board[m.ty][m.tx];
            gameState.board[m.ty][m.tx] = gameState.board[m.fy][m.fx];
            gameState.board[m.fy][m.fx] = null;
            
            if ((color === 'R' && m.ty === 8 && m.tx === 3) || (color === 'W' && m.ty === 0 && m.tx === 3)) {
                gameState.board[m.fy][m.fx] = gameState.board[m.ty][m.tx];
                gameState.board[m.ty][m.tx] = captured;
                return m;
            }

            let score = minimax(gameState.board, depth - 1, -Infinity, Infinity, false, color, oppColor);
            
            gameState.board[m.fy][m.fx] = gameState.board[m.ty][m.tx];
            gameState.board[m.ty][m.tx] = captured;

            if (score > bestScore) {
                bestScore = score;
                bestMoves = [m];
            } else if (score === bestScore) {
                bestMoves.push(m);
            }
        }

        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    };

    const triggerAI = () => {
       const move = calculateAIMove();
       if (move !== null) {
          gameState.isThinking = false;
          executeMove(move.fx, move.fy, move.tx, move.ty);
       } else {
           gameState.winner = gameState.turn === 'R' ? 'W' : 'R'; 
           recordFinishedGame();
           render();
       }
    };

    const checkWinCondition = () => {
        if (gameState.board[0][3] && gameState.board[0][3].owner === 'W') return 'W';
        if (gameState.board[8][3] && gameState.board[8][3].owner === 'R') return 'R';
        
        if (getAllValidMoves(gameState.board, 'R').length === 0) return 'W';
        if (getAllValidMoves(gameState.board, 'W').length === 0) return 'R';

        return null;
    };

    // --- 互動與控制流程 ---
    window.handleGridClick = (x, y) => {
        if (gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.isTossing) return;
        if (settings.mode === 'PvE' && gameState.turn !== settings.playerColor) return;

        const piece = gameState.board[y][x];

        if (gameState.selectedPiece) {
            const { x: fx, y: fy } = gameState.selectedPiece;
            
            if (fx === x && fy === y) {
                gameState.selectedPiece = null; 
                render();
                return;
            }

            if (piece && piece.owner === gameState.turn) {
                gameState.selectedPiece = { x, y }; 
                render();
                return;
            }

            if (checkValidMove(gameState.board, fx, fy, x, y, gameState.turn)) {
                executeMove(fx, fy, x, y);
            } else {
                gameState.selectedPiece = null;
                render();
            }
        } 
        else {
            if (piece && piece.owner === gameState.turn) {
                gameState.selectedPiece = { x, y };
                render();
            }
        }
    };

    const executeMove = (fx, fy, tx, ty) => {
        historyStack.push(cloneState(gameState));
        
        const piece = gameState.board[fy][fx];
        const target = gameState.board[ty][tx];
        
        const logAction = target ? `食 ${ANIMALS[target.rank]}` : `移動`;
        const logDesc = `${ANIMALS[piece.rank]} ${logAction} 至 (${tx}, ${ty})`;
        gameState.gameLog.push({ turn: gameState.turn, desc: logDesc });

        gameState.board[ty][tx] = piece;
        gameState.board[fy][fx] = null;
        gameState.lastMove = { fx, fy, tx, ty };
        gameState.selectedPiece = null;
        gameState.isAnimating = true; 
        
        render(); 

        setTimeout(() => {
            gameState.isAnimating = false;
            gameState.winner = checkWinCondition();
            
            if (!gameState.winner) {
                gameState.turn = gameState.turn === 'R' ? 'W' : 'R';
                if (gameState.turn === 'R') gameState.turnCount++;
            }

            if (gameState.winner) {
                recordFinishedGame();
                render();
            } else if (settings.mode === 'PvE' && gameState.turn !== settings.playerColor) {
                gameState.isThinking = true;
                render();
                setTimeout(triggerAI, 600);
            } else {
                render();
            }
        }, 300);
    };

    window.toggleHintMode = () => { isHintMode = !isHintMode; render(); };

    // --- 獨立 Menu 與 Record ---
    window.openMenu = () => { pendingSettings = cloneState(settings); isMenuOpen = true; isRecordOpen = false; render(); };
    window.cancelMenu = () => { isMenuOpen = false; render(); };
    window.setSetting = (key, value) => { if (pendingSettings) { pendingSettings[key] = value; updateMenuDOM(); }};
    window.setPlayerName = (key, value) => { if (pendingSettings) pendingSettings[key] = value; };
    window.setDifficulty = (val) => { if (pendingSettings) { pendingSettings.aiDifficulty = val; updateMenuDOM(); }};
    window.toggleRecord = () => { isRecordOpen = !isRecordOpen; selectedHistoryMatch = null; render(); };
    window.toggleRule = () => { isRuleOpen = !isRuleOpen; render(); };
    window.viewMatchDetail = (matchId) => { if (matchId === 'current') selectedHistoryMatch = 'current'; else selectedHistoryMatch = matchHistory.find(m => m.id === matchId); render(); };

    const updateMenuDOM = () => {
        const isPvE = pendingSettings.mode === 'PvE';
        
        const btnPve = document.getElementById('btn-mode-pve');
        const btnPvp = document.getElementById('btn-mode-pvp');
        if(btnPve) btnPve.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${isPvE ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnPvp) btnPvp.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${!isPvE ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        
        const pveSettings = document.getElementById('pve-settings');
        const emptySpace = document.getElementById('empty-space');
        if(pveSettings) pveSettings.style.display = isPvE ? 'flex' : 'none';
        if(emptySpace) emptySpace.style.display = isPvE ? 'none' : 'block';

        const p2Input = document.getElementById('input-p2');
        if(p2Input) p2Input.style.display = isPvE ? 'none' : 'block';
        const p1Input = document.getElementById('input-p1');
        if(p1Input) p1Input.placeholder = isPvE ? "你的名字" : "玩家 1 (紅)";

        const btnFmPlayer = document.getElementById('btn-fm-player');
        const btnFmAi = document.getElementById('btn-fm-ai');
        const btnFmRandom = document.getElementById('btn-fm-random');
        if(btnFmPlayer) btnFmPlayer.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'PLAYER' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnFmAi) btnFmAi.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'AI' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnFmRandom) btnFmRandom.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'RANDOM' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;

        for (let i = 1; i <= 15; i++) {
            const btn = document.getElementById(`btn-diff-${i}`);
            if (btn) {
                const isActive = i === pendingSettings.aiDifficulty;
                let baseClass = "flex items-center justify-center py-2 lg:py-2.5 rounded text-[12px] lg:text-[14px] transition-colors key-base ";
                if (i <= 10) btn.className = baseClass + (isActive ? 'bg-white text-black font-bold' : 'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900 hover:text-white');
                else if (i <= 13) btn.className = baseClass + (isActive ? 'bg-red-600 text-white font-bold border border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.4)]' : 'bg-[#111] text-red-500/70 font-medium border border-red-900/50 hover:bg-red-950/30 hover:text-red-500');
                else btn.className = baseClass + (isActive ? 'bg-purple-600 text-white font-bold border border-purple-600 shadow-[0_0_10px_rgba(147,51,234,0.5)]' : 'bg-[#111] text-purple-500/70 font-medium border border-purple-900/50 hover:bg-purple-900/30 hover:text-purple-400');
            }
        }

        let diffLabel = "普通 (LV.5)";
        if (pendingSettings.aiDifficulty <= 3) diffLabel = `新手 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 7) diffLabel = `進階 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 10) diffLabel = `大師 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 13) diffLabel = `地獄 HELL (LV.${pendingSettings.aiDifficulty})`;
        else diffLabel = `煉獄 PURGATORY (LV.${pendingSettings.aiDifficulty})`;
        
        const diffLabelEl = document.getElementById('ai-diff-label');
        if (diffLabelEl) {
            if (pendingSettings.aiDifficulty >= 14) diffLabelEl.className = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
            else if (pendingSettings.aiDifficulty > 10) diffLabelEl.className = 'text-red-500 font-black tracking-widest';
            else diffLabelEl.className = 'text-white font-bold';
            diffLabelEl.innerText = diffLabel;
        }
    };

    window.initGame = () => {
      isMenuOpen = false;
      isRecordOpen = false;
      if (pendingSettings) settings = cloneState(pendingSettings);
      
      const p1Name = settings.player1Name.trim() || (settings.mode === 'PvE' ? 'YOU' : 'P1');
      const aiName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
      const p2Name = settings.mode === 'PvE' ? aiName : (settings.player2Name.trim() || 'P2');

      gameState = {
        board: getInitialBoard(), turn: 'R', winner: null, turnCount: 1, isThinking: false, isAnimating: false,
        lastMove: null, gameLog: [], isTossing: false, selectedPiece: null,
        redName: p1Name, whiteName: p2Name
      };
      historyStack = [];

      if (settings.mode === 'PvE') {
          if (settings.firstMove === 'RANDOM') {
              gameState.isTossing = true;
              settings.playerColor = Math.random() < 0.5 ? 'R' : 'W';
          } else {
              settings.playerColor = settings.firstMove === 'AI' ? 'W' : 'R';
          }

          if (settings.playerColor === 'W') {
              gameState.redName = p2Name; 
              gameState.whiteName = p1Name; 
          } else {
              gameState.redName = p1Name; 
              gameState.whiteName = p2Name;
          }

          if (gameState.isTossing) {
              render(); 
              setTimeout(() => {
                  gameState.isTossing = false;
                  render();
                  if (gameState.turn !== settings.playerColor) { 
                      gameState.isThinking = true; render(); setTimeout(triggerAI, 800);
                  } else { render(); }
              }, 3500); 
              return;
          } else {
              if (gameState.turn !== settings.playerColor) {
                  gameState.isThinking = true; setTimeout(() => { render(); setTimeout(triggerAI, 800); }, 0);
              }
          }
      }
      render();
    };

    window.handleUndo = () => {
      if (historyStack.length === 0 || gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.isTossing) return;
      if (settings.mode === 'PvE') {
         let targetState = null;
         while (historyStack.length > 0) {
             let prev = historyStack.pop();
             if (prev.turn === settings.playerColor) { targetState = prev; break; }
         }
         if (targetState) gameState = targetState; else { window.initGame(); return; }
      } else { gameState = historyStack.pop(); }
      
      gameState.lastMove = null; gameState.isAnimating = false; gameState.selectedPiece = null;
      render();
    };

    const getMenuHTML = () => {
      if (!isMenuOpen) return '';
      const isPvE = pendingSettings.mode === 'PvE';
      let diffLabel = "普通 (LV.5)";
      if (pendingSettings.aiDifficulty <= 3) diffLabel = `新手 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 7) diffLabel = `進階 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 10) diffLabel = `大師 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 13) diffLabel = `地獄 (LV.${pendingSettings.aiDifficulty})`;
      else diffLabel = `煉獄 (LV.${pendingSettings.aiDifficulty})`;
      
      let diffColor = 'text-white font-bold';
      if (pendingSettings.aiDifficulty >= 14) diffColor = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
      else if (pendingSettings.aiDifficulty > 10) diffColor = 'text-red-500 font-black tracking-widest';

      const backToLobbyHTML = `<a href="index.html" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] hover:text-white transition-colors pt-1 lg:pt-1.5 flex items-center gap-1.5 key-base" style="text-decoration: none;"><img src="./assets/gamehub.svg" alt="Hub" class="h-[12px] opacity-70 icon-white" onerror="this.style.display='none'"> 返回遊戲大堂</a>`;

      const closeBtnHTML = gameState 
        ? `<button onclick="window.cancelMenu()" class="text-white text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-neutral-300 transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white" onerror="this.outerHTML='✕'"></button>`
        : `<div class="h-[12px] lg:h-[15px] pt-1 lg:pt-1.5"></div>`;

      let diffGridHTML = '<div class="grid grid-cols-5 gap-1.5 lg:gap-2 w-full mt-1">';
      for (let i = 1; i <= 15; i++) {
          const isActive = pendingSettings.aiDifficulty === i;
          let btnClass = "diff-btn flex items-center justify-center py-2 lg:py-2.5 rounded text-[12px] lg:text-[14px] transition-colors key-base ";
          if (i <= 10) btnClass += isActive ? 'bg-white text-black font-bold' : 'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900 hover:text-white';
          else if (i <= 13) btnClass += isActive ? 'bg-red-600 text-white font-bold border border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.4)]' : 'bg-[#111] text-red-500/70 font-medium border border-red-900/50 hover:bg-red-950/30 hover:text-red-500';
          else btnClass += isActive ? 'bg-purple-600 text-white font-bold border border-purple-600 shadow-[0_0_10px_rgba(147,51,234,0.5)]' : 'bg-[#111] text-purple-500/70 font-medium border border-purple-900/50 hover:bg-purple-900/30 hover:text-purple-400';
          diffGridHTML += `<button id="btn-diff-${i}" data-val="${i}" onclick="window.setDifficulty(${i})" class="${btnClass}">${i}</button>`;
      }
      diffGridHTML += '</div>';

      return `
        <div id="menu-layer" class="fixed inset-0 z-50 bg-black flex flex-col overflow-y-auto ${menuJustOpened ? 'animate-fade-in' : ''}">
          <header class="flex-none pt-6 pb-2 px-5 lg:px-12 flex items-center justify-between z-30 w-full shrink-0">
            ${backToLobbyHTML}
            ${closeBtnHTML}
          </header>
          <div class="flex-1 flex flex-col items-center justify-center gap-6 pb-10 px-6 w-full mt-4 lg:mt-0">
            <div class="flex flex-col items-center justify-center gap-3 mb-2">
               <img src="./assets/Logo.svg" alt="LOGO" class="h-[22px] lg:h-[28px] object-contain opacity-90 icon-white" onerror="this.style.display='none'">
               <div class="text-white font-chess tracking-[0.4em] text-[13px] lg:text-[15px] font-light opacity-60">鬥獸棋</div>
            </div>
            <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3">
              <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase">GAME MODE</div>
              <div class="flex w-full gap-2">
                <button id="btn-mode-pve" data-val="PvE" onclick="window.setSetting('mode', 'PvE')" class="mode-btn flex-1 py-3 lg:py-3.5 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.mode === 'PvE' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">單人 (對電腦)</button>
                <button id="btn-mode-pvp" data-val="PvP" onclick="window.setSetting('mode', 'PvP')" class="mode-btn flex-1 py-3 lg:py-3.5 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.mode === 'PvP' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">雙人 (對戰)</button>
              </div>
            </div>
            <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3">
              <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase w-full text-center">PLAYER NAME</div>
              <div class="flex w-full gap-2">
                <input type="text" id="input-p1" value="${pendingSettings.player1Name}" oninput="window.setPlayerName('player1Name', this.value)" placeholder="${isPvE ? '你的名字' : '玩家 1 (紅)'}" class="flex-1 min-w-0 bg-[#111] border border-neutral-800 rounded-lg py-3 lg:py-3.5 px-4 text-[12px] lg:text-[14px] text-white text-center focus:outline-none focus:border-neutral-500 transition-colors placeholder-neutral-600 font-medium tracking-widest">
                <input type="text" id="input-p2" value="${pendingSettings.player2Name}" oninput="window.setPlayerName('player2Name', this.value)" placeholder="玩家 2 (白)" class="flex-1 min-w-0 bg-[#111] border border-neutral-800 rounded-lg py-3 lg:py-3.5 px-4 text-[12px] lg:text-[14px] text-white text-center focus:outline-none focus:border-neutral-500 transition-colors placeholder-neutral-600 font-medium tracking-widest" style="display: ${isPvE ? 'none' : 'block'}">
              </div>
            </div>
            <div id="pve-settings" class="w-full flex-col items-center gap-3 animate-fade-in" style="display: ${isPvE ? 'flex' : 'none'}">
              <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3 mt-1">
                <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase flex justify-between w-full"><span>AI DIFFICULTY</span><span id="ai-diff-label" class="${diffColor}">${diffLabel}</span></div>
                ${diffGridHTML}
              </div>
              <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3 mt-2">
                <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase">FIRST MOVE</div>
                <div class="flex w-full gap-2">
                  <button id="btn-fm-player" data-val="PLAYER" onclick="window.setSetting('firstMove', 'PLAYER')" class="fm-btn flex-1 py-3 lg:py-3.5 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'PLAYER' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">先攻 (紅)</button>
                  <button id="btn-fm-ai" data-val="AI" onclick="window.setSetting('firstMove', 'AI')" class="fm-btn flex-1 py-3 lg:py-3.5 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'AI' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">後攻 (白)</button>
                  <button id="btn-fm-random" data-val="RANDOM" onclick="window.setSetting('firstMove', 'RANDOM')" class="fm-btn flex-1 py-3 lg:py-3.5 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'RANDOM' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">隨機</button>
                </div>
              </div>
            </div>
            <div id="empty-space" class="h-[100px] w-full max-w-[340px] lg:max-w-[440px]" style="display: ${!isPvE ? 'block' : 'none'}"></div>
            <div class="w-full max-w-[340px] lg:max-w-[440px] mt-2">
              <button onclick="window.initGame()" class="w-full bg-white hover:bg-neutral-200 active:bg-neutral-300 text-black py-4 lg:py-5 rounded-lg font-bold tracking-[0.15em] text-[12px] lg:text-[16px] uppercase key-base">${gameState ? "RESTART 重新開始" : "開始新棋局"}</button>
            </div>
          </div>
        </div>
      `;
    };

    // --- 渲染純 SVG 鬥獸棋盤 (動態翻轉版) ---
    const generateBoardHTML = () => {
      const CELL_W = 50; 
      const CELL_H = 55; 
      const BOARD_W = COLS * CELL_W;
      const BOARD_H = ROWS * CELL_H;
      const coinRadius = 19;
      
      // 判斷是否需要將棋盤視角翻轉 (永遠將 User 所屬隊伍放喺最下方)
      // 在 PvE 模式中，如果 user 控制 Red (邏輯上 Red 喺頂部 y=0..2)，我哋就翻轉畫面
      const flip = (settings.mode === 'PvE' && settings.playerColor === 'R') || (settings.mode === 'PvP');
      
      const getV = (x, y) => ({
          vx: flip ? COLS - 1 - x : x,
          vy: flip ? ROWS - 1 - y : y
      });

      let bgHTML = `<rect x="0" y="0" width="${BOARD_W}" height="${BOARD_H}" fill="#000000" rx="6" stroke="#334155" stroke-width="2" />`;
      
      // 畫水域 (2x3 block) 與波浪線
      let waterHTML = '';
      for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
              if (isWater(x, y)) {
                  const {vx, vy} = getV(x, y);
                  const cx = vx * CELL_W + CELL_W / 2;
                  const cy = vy * CELL_H + CELL_H / 2;
                  waterHTML += `<rect x="${vx * CELL_W}" y="${vy * CELL_H}" width="${CELL_W}" height="${CELL_H}" fill="#0284c7" fill-opacity="0.25" />`;
                  // 簡單波浪線
                  waterHTML += `<path d="M${cx-12},${cy} Q${cx-6},${cy-5} ${cx},${cy} T${cx+12},${cy}" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />`;
              }
          }
      }

      // 畫格線
      let linesHTML = `<g stroke="#334155" stroke-width="1.5">`;
      for (let i = 1; i < COLS; i++) linesHTML += `<line x1="${i * CELL_W}" y1="0" x2="${i * CELL_W}" y2="${BOARD_H}" />`;
      for (let i = 1; i < ROWS; i++) linesHTML += `<line x1="0" y1="${i * CELL_H}" x2="${BOARD_W}" y2="${i * CELL_H}" />`;
      linesHTML += `</g>`;

      // 畫特珠地形 (獸穴、陷阱) - 移除文字
      const drawSpecial = (cx, cy, type, color) => {
          const st = color === 'R' ? '#ef4444' : '#ffffff';
          if (type === 'DEN') {
              return `<circle cx="${cx}" cy="${cy}" r="${coinRadius - 2}" fill="${st}" fill-opacity="0.15" stroke="${st}" stroke-width="2" stroke-dasharray="4" />`;
          } else if (type === 'TRAP') {
              return `<rect x="${cx - 11}" y="${cy - 11}" width="22" height="22" fill="${st}" fill-opacity="0.1" stroke="${st}" stroke-width="1.5" stroke-dasharray="2" transform="rotate(45 ${cx} ${cy})" />`;
          }
      };

      let terrainHTML = '';
      let piecesHTML = '';
      let interactHTML = '';
      let highlightHTML = '';

      // 取得合法步數作高亮
      let validTargetCells = [];
      if (gameState.selectedPiece) {
          const { x: fx, y: fy } = gameState.selectedPiece;
          const allMoves = getAllValidMoves(gameState.board, gameState.turn);
          validTargetCells = allMoves.filter(m => m.fx === fx && m.fy === fy);
      }

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const {vx, vy} = getV(x, y);
          const cx = vx * CELL_W + CELL_W / 2;
          const cy = vy * CELL_H + CELL_H / 2;
          const piece = gameState.board[y][x];

          // 繪製地形
          if (isDen(x, y, 'R')) terrainHTML += drawSpecial(cx, cy, 'DEN', 'R');
          else if (isDen(x, y, 'W')) terrainHTML += drawSpecial(cx, cy, 'DEN', 'W');
          else if (isTrap(x, y, 'R')) terrainHTML += drawSpecial(cx, cy, 'TRAP', 'R');
          else if (isTrap(x, y, 'W')) terrainHTML += drawSpecial(cx, cy, 'TRAP', 'W');

          // 點擊區 (傳遞原始邏輯座標)
          interactHTML += `<rect x="${vx * CELL_W}" y="${vy * CELL_H}" width="${CELL_W}" height="${CELL_H}" fill="transparent" class="cursor-pointer hover:fill-white/10 transition-colors" onclick="window.handleGridClick(${x}, ${y})" />`;

          // 高亮合法步數
          const isTarget = validTargetCells.find(m => m.tx === x && m.ty === y);
          if (isTarget && !gameState.isAnimating) {
              const ringColor = piece ? '#ef4444' : '#22c55e'; // 食子紅，空位綠
              highlightHTML += `<circle cx="${cx}" cy="${cy}" r="${coinRadius + 3}" fill="none" stroke="${ringColor}" stroke-width="2" class="animate-pulse" pointer-events="none" />`;
          }

          if (piece) {
            let isSelected = gameState.selectedPiece && gameState.selectedPiece.x === x && gameState.selectedPiece.y === y;
            let isLastMoved = gameState.lastMove && gameState.lastMove.tx === x && gameState.lastMove.ty === y;
            
            // 象棋風格：黑底、紅圈紅字 / 白圈白字、內圈往外擴、字體加大 (Size 20)
            let fill = '#111111'; // 黑底
            let stroke = piece.owner === 'R' ? '#ef4444' : '#ffffff';
            let textCol = piece.owner === 'R' ? '#ef4444' : '#ffffff'; // 紅字或白字
            let animClass = (isLastMoved && gameState.isAnimating) ? 'anim-move' : '';
            
            let selHighlight = isSelected ? `<circle cx="${cx}" cy="${cy}" r="${coinRadius + 4}" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />` : '';

            piecesHTML += `
              <g class="${animClass}" style="transform-origin: ${cx}px ${cy}px; pointer-events: none;">
                ${selHighlight}
                <circle cx="${cx}" cy="${cy}" r="${coinRadius}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" />
                <circle cx="${cx}" cy="${cy}" r="${coinRadius * 0.82}" fill="none" stroke="${stroke}" stroke-width="1" opacity="0.7" />
                <text x="${cx}" y="${cy + 7}" fill="${textCol}" font-size="20" font-weight="300" font-family="Noto Sans TC" text-anchor="middle">${ANIMALS[piece.rank]}</text>
              </g>
            `;
          }

          // 提示模式 (Hint)
          const isHint = isHintMode && currentHints.find(m => m.fx === x && m.fy === y);
          if (isHint && !gameState.isThinking) {
              highlightHTML += `<circle cx="${cx}" cy="${cy}" r="${coinRadius + 2}" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4" class="animate-pulse" pointer-events="none" />`;
          }
        }
      }

      return `
        <svg viewBox="-10 -10 ${BOARD_W + 20} ${BOARD_H + 20}" preserveAspectRatio="xMidYMid meet" class="jungle-board-svg lg:h-full lg:max-h-[85vh] transition-transform origin-center">
          ${bgHTML}
          ${waterHTML}
          ${linesHTML}
          ${terrainHTML}
          ${highlightHTML}
          ${piecesHTML}
          ${interactHTML}
        </svg>
      `;
    };

    function render() {
      const appDiv = document.getElementById('app');
      const menuHTML = getMenuHTML();

      if (!gameState) { appDiv.innerHTML = menuHTML; return; }

      let recordHTML = '';
      if (isRecordOpen) {
        if (!selectedHistoryMatch) {
          let historyListHTML = matchHistory.map(m => `
            <div onclick="window.viewMatchDetail(${m.id})" class="bg-[#111] rounded-lg p-5 border border-neutral-800 hover:border-neutral-600 transition-colors cursor-pointer group flex items-center justify-between">
               <div class="flex flex-col gap-1">
                  <div class="text-[12px] lg:text-[15px] font-bold ${m.winner === 'R' ? 'text-c4-red' : m.winner === 'W' ? 'text-white' : 'text-neutral-500'} tracking-wider">${m.winner === 'R' ? '紅方獲勝' : m.winner === 'W' ? '白方獲勝' : '平局'}</div>
                  <div class="text-[9px] lg:text-[11px] text-neutral-500 uppercase tracking-widest">${m.settings.mode} | LV.${m.settings.aiDifficulty} | 回合: ${Math.ceil(m.gameLog.length / 2)}</div>
                  <div class="text-[8px] lg:text-[10px] text-neutral-600 font-medium">${m.timestamp}</div>
               </div>
               <img src="./assets/arrow.svg" alt="Detail" class="h-[10px] lg:h-[12px] opacity-20 group-hover:opacity-100 transition-opacity -rotate-90 icon-white" onerror="this.style.display='none'">
            </div>
          `).join('');

          const currentEntry = gameState.gameLog.length > 0 ? `
            <div onclick="window.viewMatchDetail('current')" class="bg-[#1a1a1a] rounded-lg p-5 border-2 border-dashed border-neutral-700 hover:border-white transition-colors cursor-pointer mb-4 flex items-center justify-between">
               <div class="flex flex-col gap-1">
                  <div class="text-[14px] lg:text-[17px] font-bold text-white tracking-wide">當前賽局</div>
                  <div class="text-[9px] lg:text-[11px] text-neutral-400 uppercase tracking-widest">In Progress...</div>
               </div>
               <div class="w-2 h-2 bg-neutral-400 rounded-full animate-pulse"></div>
            </div>
          ` : '';

          recordHTML = `
          <div class="fixed inset-0 z-50 bg-black flex flex-col overflow-hidden animate-fade-in">
            <header class="flex-none pt-6 pb-4 px-5 lg:px-12 flex items-center justify-center z-30 w-full border-b border-neutral-800 shrink-0 relative">
               <div class="text-white font-bold tracking-[0.15em] text-[12px] lg:text-[16px] uppercase pt-0.5">MATCH RECORD</div>
               <button onclick="window.toggleRecord()" class="absolute right-5 lg:right-12 text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white active:text-white transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white" onerror="this.outerHTML='✕'"></button>
            </header>
            <div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pt-6 pb-10 px-5 max-w-[800px] w-full mx-auto">
              ${currentEntry}
              <div class="flex flex-col gap-3">${historyListHTML || '<div class="text-center py-20 text-neutral-700 tracking-widest text-[11px] uppercase">暫無紀錄</div>'}</div>
            </div>
          </div>
          `;
        } else {
          let matchData = selectedHistoryMatch === 'current' ? { settings, gameLog: cloneState(gameState.gameLog), isLive: true } : selectedHistoryMatch;
          let logContent = matchData.gameLog.slice().reverse().map((log, idx) => {
              const actualIdx = matchData.gameLog.length - idx;
              const colorClass = log.turn === 'R' ? 'text-c4-red' : 'text-white';
              const teamName = log.turn === 'R' ? '紅' : '白';
              return `
              <div class="flex items-center justify-between py-3 lg:py-4 border-b border-neutral-800/50 last:border-0">
                  <div class="flex items-center gap-3">
                      <div class="text-[10px] text-neutral-600 font-bold w-6">#${actualIdx}</div>
                      <div class="w-6 h-6 rounded border border-neutral-700 bg-neutral-800 flex items-center justify-center ${colorClass} text-[12px] font-tc">${teamName}</div>
                      <div class="text-[12px] lg:text-[14px] font-medium text-neutral-300 tracking-wide">${log.desc}</div>
                  </div>
              </div>`;
          }).join('');

          recordHTML = `
          <div class="fixed inset-0 z-50 bg-black flex flex-col overflow-hidden animate-fade-in">
            <header class="flex-none pt-6 pb-4 px-5 lg:px-12 flex items-center justify-between z-30 w-full border-b border-neutral-800 shrink-0">
               <button onclick="window.viewMatchDetail(null)" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white transition-colors pt-1 lg:pt-1.5 flex items-center gap-1.5 key-base"><img src="./assets/arrow.svg" alt="<" class="h-[8px] rotate-90 opacity-60 icon-white" onerror="this.outerHTML='<' "> BACK</button>
               <div class="flex flex-col items-center">
                 <span class="text-white font-black tracking-[0.2em] text-[12px] lg:text-[16px] uppercase pt-0.5">LOG DETAIL</span>
                 <span class="text-[8px] text-neutral-600 tracking-widest uppercase">${matchData.isLive ? 'LIVE' : 'PAST MATCH'}</span>
               </div>
               <button onclick="window.toggleRecord()" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white active:text-white transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white" onerror="this.outerHTML='✕'"></button>
            </header>
            <div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pt-4 pb-10 px-5 max-w-[800px] w-full mx-auto">
              <div class="bg-[#111] rounded-lg p-4 lg:p-6 border border-neutral-800 shadow-sm flex flex-col">${logContent || '<div class="text-neutral-600 text-center py-10 text-xs">暫無步數</div>'}</div>
            </div>
          </div>
          `;
        }
      }

      let tossHTML = '';
      if (gameState.isTossing) {
         const tossMsg = settings.playerColor === 'R' ? '先攻' : '後攻';
         const flipClass = settings.playerColor === 'R' ? "anim-flip-red" : "anim-flip-white";
         tossHTML = `
         <div class="fixed inset-0 z-[60] bg-black/95 flex flex-col items-center justify-center">
            <div class="coin-scene mb-12 shadow-[0_0_30px_rgba(255,255,255,0.1)] rounded-full">
               <div class="coin-wrapper ${flipClass}">
                  <div class="coin-face coin-front"></div>
                  <div class="coin-face coin-back"></div>
               </div>
            </div>
            <div class="text-white font-bold tracking-[0.2em] text-[18px] lg:text-[22px] opacity-0 anim-fade-in-delayed uppercase">${tossMsg}</div>
         </div>`;
      }

      let statusBannerHTML = '';
      if (gameState.winner) {
        const winnerDisplay = gameState.winner === 'R' ? gameState.redName : (gameState.winner === 'W' ? gameState.whiteName : '平手 DRAW');
        statusBannerHTML = `<div class="w-full ${gameState.winner === 'DRAW' ? 'bg-[#333]' : (gameState.winner === 'R' ? 'bg-c4-red/20 border border-c4-red/50 text-c4-red' : 'bg-white/10 border border-white/30 text-white')} rounded-lg py-3.5 flex items-center justify-center font-bold text-[14px] lg:text-[17px] tracking-[0.15em] uppercase animate-pulse shadow-lg">${winnerDisplay} 勝利 !!!</div>`;
      } else {
        const isPVE = settings.mode === 'PvE';
        let rightContent = '';
        let borderClass = 'border-neutral-800';

        if (isPVE) {
            if (gameState.turn === settings.playerColor) {
                const pName = settings.playerColor === 'R' ? gameState.redName : gameState.whiteName;
                const pColor = settings.playerColor === 'R' ? 'text-c4-red' : 'text-white';
                rightContent = `<span class="${pColor} font-bold tracking-wider uppercase">${pName} TURN</span>`;
            } else {
                const aiName = settings.playerColor === 'R' ? gameState.whiteName : gameState.redName;
                if (gameState.isThinking) {
                    rightContent = `<div class="flex items-center gap-3"><span class="text-white font-bold tracking-wider uppercase">${aiName} TURN</span><span class="text-[#22d3ee] font-bold animate-pulse tracking-widest">THINKING...</span></div>`;
                    borderClass = 'border-[#22d3ee]/30 shadow-[0_0_15px_rgba(34,211,238,0.1)]';
                } else rightContent = `<span class="text-white font-bold tracking-wider uppercase">${aiName} TURN</span>`;
            }
        } else {
            rightContent = gameState.turn === 'R' ? `<span class="text-c4-red font-bold tracking-wider uppercase">${gameState.redName} TURN</span>` : `<span class="text-white font-bold tracking-wider uppercase">${gameState.whiteName} TURN</span>`;
        }

        statusBannerHTML = `<div class="w-full bg-[#111111] rounded-lg py-3.5 lg:py-4 flex items-center justify-between px-6 font-medium text-[12px] lg:text-[16px] tracking-[0.15em] text-neutral-300 uppercase border ${borderClass} transition-colors duration-300">
            <div class="flex items-center"><span>TURN ${Math.ceil(gameState.gameLog.length / 2) + 1}</span></div>
            ${rightContent}
        </div>`;
      }

      let ruleHTML = '';
      if (isRuleOpen) {
          ruleHTML = `
          <div class="fixed inset-0 z-[70] bg-black/90 flex flex-col items-center justify-center animate-fade-in px-4">
             <div class="bg-[#111] border border-neutral-800 rounded-xl w-full max-w-[400px] flex flex-col overflow-hidden shadow-2xl shadow-black">
                 <div class="p-4 lg:p-5 border-b border-neutral-800 flex justify-between items-center bg-[#1a1a1a]">
                     <div class="text-white font-bold tracking-[0.2em] text-[15px] lg:text-[17px]">玩法教學 RULES</div>
                     <button onclick="window.toggleRule()" class="text-neutral-400 hover:text-white transition-colors"><img src="./assets/close.svg" alt="X" class="h-[12px] icon-white" onerror="this.outerHTML='✕'"></button>
                 </div>
                 <div class="p-5 lg:p-6 text-[14px] lg:text-[16px] text-neutral-300 leading-relaxed space-y-5 max-h-[60vh] overflow-y-auto hide-scrollbar">
                     <div>
                         <div class="text-white font-bold mb-1.5 flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>【階級吃法】</div>
                         <div class="pl-3.5">鼠 > 象 > 獅 > 虎 > 豹 > 狼 > 狗 > 貓 > 鼠。<br>同級動物可互相吃掉。</div>
                     </div>
                     <div>
                         <div class="text-white font-bold mb-1.5 flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>【小河與跳河】</div>
                         <div class="pl-3.5 space-y-1">
                             <div>• 只有 <span class="text-blue-400 font-bold">老鼠</span> 能進入水域。</div>
                             <div>• 水中與陸地的動物 <span class="text-red-400 font-bold">不能互吃</span>。</div>
                             <div>• <span class="text-yellow-500 font-bold">獅、虎</span> 可直線或橫向跳過小河，吃掉對岸較弱動物。</div>
                             <div>• 若跳河路線中有老鼠阻擋，則無法跳躍。</div>
                         </div>
                     </div>
                     <div>
                         <div class="text-white font-bold mb-1.5 flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div>【陷阱與獸穴】</div>
                         <div class="pl-3.5 space-y-1">
                             <div>• 走入敵方 <span class="text-orange-400 font-bold">陷阱</span> 後，失去戰鬥力，任何敵方皆可吃你。</div>
                             <div>• 不能進入己方的獸穴。</div>
                             <div>• 成功走入敵方 <span class="text-red-500 font-bold">獸穴</span> 即獲勝！</div>
                         </div>
                     </div>
                 </div>
                 <div class="p-4 lg:p-5 border-t border-neutral-800 bg-[#0a0a0a]">
                     <button onclick="window.toggleRule()" class="w-full py-3.5 bg-white text-black font-bold rounded-lg tracking-[0.2em] text-[15px] hover:bg-neutral-200 transition-colors">我明白了</button>
                 </div>
             </div>
          </div>
          `;
      }

      // 將文字圖例抽出並顯示於下方
      const capturedAreaHTML = `
        <div class="jungle-player-cards flex flex-col gap-2 lg:gap-3 px-3 lg:px-6 w-full">
            <div class="jungle-player-card flex items-center justify-between bg-[#0a0a0a] border border-neutral-800 rounded-lg p-2.5 lg:p-3 relative overflow-hidden">
              <div class="absolute left-0 top-0 bottom-0 w-1 ${gameState.turn === 'W' ? 'bg-white shadow-[0_0_8px_#ffffff]' : 'bg-transparent'} transition-colors"></div>
              <div class="text-[10px] lg:text-[12px] text-neutral-500 font-medium tracking-[0.15em] uppercase w-full truncate ml-2">${gameState.whiteName}</div>
              <svg viewBox="0 0 42 42" class="w-[20px] h-[20px] lg:w-[24px] lg:h-[24px] flex-shrink-0"><circle cx="21" cy="21" r="19" fill="#111" stroke="#ffffff" stroke-width="1.5"/><circle cx="21" cy="21" r="15.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/></svg>
            </div>
            <div class="jungle-player-card flex items-center justify-between bg-[#0a0a0a] border border-neutral-800 rounded-lg p-2.5 lg:p-3 relative overflow-hidden">
              <div class="absolute left-0 top-0 bottom-0 w-1 ${gameState.turn === 'R' ? 'bg-c4-red shadow-[0_0_8px_#ef4444]' : 'bg-transparent'} transition-colors"></div>
              <div class="text-[10px] lg:text-[12px] text-neutral-500 font-medium tracking-[0.15em] uppercase w-full truncate ml-2">${gameState.redName}</div>
              <svg viewBox="0 0 42 42" class="w-[20px] h-[20px] lg:w-[24px] lg:h-[24px] flex-shrink-0"><circle cx="21" cy="21" r="19" fill="#111" stroke="#ef4444" stroke-width="1.5"/><circle cx="21" cy="21" r="15.5" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.7"/></svg>
            </div>
        </div>
        <!-- 圖例 Legend -->
        <div class="jungle-legend flex items-center justify-center gap-8 mt-5 mb-2 opacity-80 px-4">
            <div class="flex items-center gap-2 text-[10px] lg:text-[12px] text-neutral-400 font-medium tracking-[0.1em]">
                <svg viewBox="0 0 24 24" class="w-[18px] h-[18px]"><rect x="4" y="4" width="16" height="16" fill="#a3a3a3" fill-opacity="0.1" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="2" transform="rotate(45 12 12)"/></svg>
                陷阱 TRAP
            </div>
            <div class="flex items-center gap-2 text-[10px] lg:text-[12px] text-neutral-400 font-medium tracking-[0.1em]">
                <svg viewBox="0 0 24 24" class="w-[18px] h-[18px]"><circle cx="12" cy="12" r="8" fill="#a3a3a3" fill-opacity="0.1" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="4"/></svg>
                獸穴 DEN
            </div>
        </div>
      `;

      const controlPanelHTML = gameState.winner ? `
        <div class="flex-1 flex flex-col items-center justify-start pt-4 gap-5 w-full animate-fade-in pb-8 lg:pb-0">
          <button onclick="window.toggleRecord()" class="w-[220px] lg:w-[260px] py-4 lg:py-5 rounded-lg border border-neutral-800 text-white font-medium text-xs lg:text-[14px] tracking-[0.15em] uppercase hover:bg-neutral-900 transition-colors key-base">MATCH RECORD</button>
          <button onclick="window.openMenu()" class="w-[220px] lg:w-[260px] py-4 lg:py-5 rounded-lg bg-white text-black font-medium text-xs lg:text-[14px] tracking-[0.15em] uppercase hover:bg-neutral-200 transition-colors key-base">MAIN MENU 主選單</button>
        </div>
      ` : `<div class="jungle-player-area flex-none bg-black pb-4 lg:pb-0">${capturedAreaHTML}</div>`;

      let modeDisplay = settings.mode === 'PvE' ? (settings.firstMove === 'PLAYER' ? '先攻' : settings.firstMove === 'AI' ? '後攻' : (settings.playerColor === 'R' ? '隨機 - 先攻' : '隨機 - 後攻')) : '雙人對戰';
      let roundDisplay = `PVP <span class="mx-2 opacity-50">|</span> 回合 ${Math.ceil(gameState.gameLog.length / 2) + 1}`;
      if (settings.mode === 'PvE') {
          let lvColorClass = 'text-white font-bold';
          if (settings.aiDifficulty >= 14) lvColorClass = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
          else if (settings.aiDifficulty > 10) lvColorClass = 'text-red-500 font-black tracking-widest';
          roundDisplay = `<span class="${lvColorClass}">LV.${settings.aiDifficulty}</span> <span class="mx-2 opacity-50">|</span> 回合 ${Math.ceil(gameState.gameLog.length / 2) + 1}`;
      }

      appDiv.innerHTML = `
        ${menuHTML}
        ${recordHTML}
        ${ruleHTML}
        ${tossHTML}
        <div class="jungle-screen w-full h-full bg-black relative flex flex-col overflow-hidden">
          <header class="jungle-header flex-none pt-4 lg:pt-6 pb-2 px-4 lg:px-12 flex items-center justify-between z-30 w-full shrink-0">
            <div class="flex items-center"><img src="./assets/Logo.svg" alt="LOGO" class="h-[19px] lg:h-[25px] object-contain opacity-90 icon-white" onerror="this.style.display='none'"></div>
            <div class="jungle-header-actions flex items-center gap-4 lg:gap-6">
              <button onclick="window.toggleRule()" class="flex items-center justify-center opacity-70 hover:opacity-100 transition-opacity key-base text-white text-[13px] lg:text-[15px] font-medium tracking-[0.1em]">玩法</button>
              <button onclick="window.toggleHintMode()" ${gameState.isThinking || gameState.isAnimating || gameState.isTossing ? 'disabled style="opacity:0.2"' : ''} class="flex items-center justify-center transition-all duration-300 key-base ${isHintMode ? 'opacity-100 drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]' : 'opacity-70 hover:opacity-100'}"><img src="./assets/ai.svg" alt="AI" class="h-[19px] lg:h-[24px] object-contain ${isHintMode ? 'icon-hint-active' : 'icon-white'}" onerror="this.outerHTML='💡'"></button>
              <button onclick="window.handleUndo()" ${historyStack.length === 0 || gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.isTossing ? 'disabled style="opacity:0.2"' : ''} class="flex items-center justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/back.svg" alt="UNDO" class="h-[14px] lg:h-[18px] object-contain icon-white" onerror="this.outerHTML='↶'"></button>
              <button onclick="window.toggleRecord()" class="flex items-center justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/record.svg" alt="REC" class="h-[16px] lg:h-[22px] object-contain icon-white" onerror="this.outerHTML='≡'"></button>
              <button onclick="window.openMenu()" ${gameState.isThinking || gameState.isAnimating || gameState.isTossing ? 'disabled style="opacity:0.2"' : ''} class="flex items-center justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/setting.svg" alt="SET" class="h-[14px] lg:h-[18px] object-contain icon-white" onerror="this.outerHTML='⚙'"></button>
            </div>
          </header>
          <div class="jungle-meta px-4 lg:px-5 lg:absolute lg:top-[85px] lg:left-12 z-20 pointer-events-none mt-1 lg:mt-0">
            <div class="text-[10px] lg:text-[13px] text-neutral-400 font-medium tracking-[0.15em] leading-relaxed uppercase">鬥獸棋<br>${modeDisplay}<br>${roundDisplay}</div>
          </div>
          <main class="jungle-main flex-1 w-full max-w-md lg:max-w-[1200px] mx-auto flex flex-col lg:flex-row min-h-0 relative z-10">
            <div class="jungle-board-section flex-1 relative min-h-0 flex flex-col justify-center lg:py-8 lg:pr-8">
              <div class="flex-1 flex items-center justify-center w-full h-full min-h-0">
                <div class="jungle-board-wrap w-full px-4 max-w-[440px] lg:max-w-[480px] mx-auto lg:px-0 flex justify-center">${generateBoardHTML()}</div>
              </div>
            </div>
            <div class="jungle-side-panel flex-none lg:w-[480px] lg:h-full flex flex-col justify-end lg:justify-center bg-black z-10 relative pb-6 lg:pb-0">
              <div class="flex-none lg:mb-4"><div class="jungle-status-wrap mt-2 mb-3 lg:mt-4 lg:mb-4 px-3 lg:px-6 h-12">${statusBannerHTML}</div></div>
              <div class="flex-none">${controlPanelHTML}</div>
            </div>
          </main>
        </div>
      `;
    }

    window.onload = () => { loadHistory(); if (!pendingSettings) pendingSettings = cloneState(settings); render(); };
  </script>
</body>
</html>
