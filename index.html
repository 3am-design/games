<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 提升 iOS 網頁體驗 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <title>Games</title>
  
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }
    }
  </script>
  
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { 
      0% { opacity: 0; transform: translateY(15px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
    
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }

    html, body { 
      background-color: #000000; 
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      height: 100%;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch; 
    }

    /* 卡片懸浮光效 */
    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .game-card:hover::before { opacity: 1; }
    .font-tc { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-black selection:bg-white/30 flex flex-col items-center min-h-screen overflow-x-hidden relative">

  <!-- 主內容區 -->
  <main class="flex-1 w-full max-w-[1000px] mx-auto px-6 py-16 lg:py-24 flex flex-col items-center justify-center relative z-10">
    
    <!-- 標題 -->
    <div class="flex flex-col items-center mb-12 lg:mb-16 animate-fade-in">
        <img src="./assets/Logo.svg" alt="LOGO" class="h-[36px] lg:h-[50px] object-contain opacity-90 invert brightness-0 mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.15)]" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIj48cGF0aCBkPSJNMTEgMjBBMCAwIDAgMCAxIDExIDIwSDEzQTkgOSAwIDAgMSAxMyAyMEExIDEgMCAwIDEgMTEgMjBaTTUgMTBBNyA3IDAgMCAxIDE5IDEwQTYgNiAwIDAgMSAxNyAxNUExIDEgMCAwIDAgMTcgMTZMMTcgMTdBMSAxIDAgMCAxIDE3IDE4SDE3QTEgMSAwIDAgMSAxNyAxOUgxN0ExIDEgMCAwIDEgMTcgMjBIMTdBMCAwIDAgMCAxIDE3IDIwWiIvPjwvc3ZnPg=='">
        <p class="text-[14px] lg:text-[16px] text-neutral-400 font-tc tracking-[0.4em] font-medium uppercase ml-[0.4em]">遊戲大堂</p>
    </div>

    <!-- 遊戲網格 -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 lg:gap-6 w-full relative z-10">
        
        <!-- Game 1: 中國象棋 -->
        <a href="chess.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-1 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-red-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <!-- Karina 優化：線框風格象棋 Icon -->
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-red-900/40 rounded-xl overflow-hidden">
                <!-- 九宮格線 -->
                <div class="absolute inset-0 flex flex-col justify-evenly py-1 lg:py-2"><div class="w-full h-[1px] bg-red-900/30"></div><div class="w-full h-[1px] bg-red-900/30"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-1 lg:px-2"><div class="h-full w-[1px] bg-red-900/30"></div><div class="h-full w-[1px] bg-red-900/30"></div></div>
                <div class="absolute w-[150%] h-[1px] bg-red-900/30 rotate-45"></div>
                <div class="absolute w-[150%] h-[1px] bg-red-900/30 -rotate-45"></div>
                
                <!-- 線框棋子 -->
                <div class="absolute w-[36px] h-[36px] lg:w-[46px] lg:h-[46px] bg-[#111] rounded-full border-[2px] border-red-500 flex items-center justify-center shadow-[0_0_12px_rgba(239,68,68,0.4)] z-10">
                    <span class="text-red-500 font-tc text-[18px] lg:text-[22px] font-bold drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] leading-none mt-[2px]">帥</span>
                </div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">中國象棋</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Chinese Chess</span>
            </div>
        </a>

        <!-- Game 2: 黑白棋 (Reversi) -->
        <a href="reversi.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-2 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <!-- Karina 優化：線框風格黑白棋 Icon -->
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-neutral-700/50 rounded-xl overflow-hidden">
                <!-- 棋盤格線 -->
                <div class="absolute inset-0 flex flex-col justify-evenly py-1 lg:py-2"><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-1 lg:px-2"><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div></div>
                
                <!-- 線框棋子 (白棋與黑棋) -->
                <div class="absolute w-[22px] h-[22px] lg:w-[28px] lg:h-[28px] bg-[#111] rounded-full border-[2px] border-white translate-x-[-8px] translate-y-[-8px] lg:translate-x-[-10px] lg:translate-y-[-10px] shadow-[0_0_10px_rgba(255,255,255,0.4)] z-10"></div>
                <div class="absolute w-[22px] h-[22px] lg:w-[28px] lg:h-[28px] bg-[#111] rounded-full border-[2px] border-neutral-600 translate-x-[8px] translate-y-[8px] lg:translate-x-[10px] lg:translate-y-[10px] shadow-[0_0_10px_rgba(0,0,0,0.8)] z-20"></div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">黑白棋</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Reversi / Othello</span>
            </div>
        </a>

        <!-- Game 3: 五子棋 (Gomoku) -->
        <a href="gomoku.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-3 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-neutral-800 rounded-2xl overflow-hidden">
                <!-- 棋盤格線 -->
                <div class="absolute inset-0 flex flex-col justify-evenly py-2 lg:py-3"><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-2 lg:px-3"><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div></div>
                
                <!-- 棋子 (線圈風格) -->
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-amber-500 translate-x-[-24px] translate-y-[-24px] lg:translate-x-[-30px] lg:translate-y-[-30px] z-10"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-neutral-400 translate-x-[-12px] translate-y-[-12px] lg:translate-x-[-15px] lg:translate-y-[-15px] z-10"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-amber-500 shadow-[0_0_12px_rgba(245,158,11,0.6)] z-10"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-neutral-400 translate-x-[12px] translate-y-[12px] lg:translate-x-[15px] lg:translate-y-[15px] z-10"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-amber-500 translate-x-[24px] translate-y-[24px] lg:translate-x-[30px] lg:translate-y-[30px] z-10"></div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">五子棋</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Gomoku</span>
            </div>
        </a>

        <!-- Game 4: 四子棋 (Connect Four) -->
        <a href="four.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-4 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-blue-900/50 rounded-xl overflow-hidden">
                <!-- 四子棋支架線條 -->
                <div class="absolute inset-0 flex justify-evenly px-1"><div class="h-full w-[1px] bg-blue-600/30"></div><div class="h-full w-[1px] bg-blue-600/30"></div><div class="h-full w-[1px] bg-blue-600/30"></div></div>
                <!-- 棋子 (雙色線圈連線) -->
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-red-500 translate-x-[-15px] translate-y-[15px]"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-yellow-400 translate-x-[0px] translate-y-[15px]"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-red-500 translate-x-[15px] translate-y-[15px] shadow-[0_0_8px_rgba(239,68,68,0.4)]"></div>
                
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-yellow-400 translate-x-[-15px] translate-y-[0px]"></div>
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-red-500 translate-x-[0px] translate-y-[0px]"></div>
                
                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-transparent rounded-full border-2 border-yellow-400 translate-x-[-15px] translate-y-[-15px]"></div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">四子棋</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Connect Four</span>
            </div>
        </a>

        <!-- Game 5: 鬥獸棋 (Jungle Chess) -->
        <a href="jungle.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-4 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-emerald-900/40 rounded-xl overflow-hidden">
                <!-- 陸地格線 -->
                <div class="absolute inset-0 flex flex-col justify-evenly py-1 lg:py-2"><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-1 lg:px-2"><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div></div>
                
                <!-- 河流 (Rivers) -->
                <div class="absolute w-[14px] h-[22px] lg:w-[18px] lg:h-[28px] bg-cyan-900/40 border border-cyan-800/60 translate-x-[-14px] lg:translate-x-[-18px] rounded-sm"></div>
                <div class="absolute w-[14px] h-[22px] lg:w-[18px] lg:h-[28px] bg-cyan-900/40 border border-cyan-800/60 translate-x-[14px] lg:translate-x-[18px] rounded-sm"></div>
                
                <!-- 棋子 (猛獸對峙) -->
                <div class="absolute w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] bg-[#111] border-[2px] border-emerald-500 rounded-full translate-x-[-14px] translate-y-[-20px] lg:translate-x-[-18px] lg:translate-y-[-26px] shadow-[0_0_10px_rgba(16,185,129,0.5)] z-10"></div>
                <div class="absolute w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] bg-[#111] border-[2px] border-rose-500 rounded-full translate-x-[14px] translate-y-[20px] lg:translate-x-[18px] lg:translate-y-[26px] shadow-[0_0_10px_rgba(244,63,94,0.5)] z-10"></div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">鬥獸棋</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Jungle</span>
            </div>
        </a>

        <!-- Game 6: 數獨 (Sudoku) -->
        <a href="sudoku.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-4 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-purple-900/40 rounded-xl overflow-hidden">
                <!-- 九宮格線 (3x3) -->
                <div class="absolute inset-0 flex flex-col justify-evenly py-0"><div class="w-full h-[1px] bg-purple-500/30"></div><div class="w-full h-[1px] bg-purple-500/30"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-0"><div class="h-full w-[1px] bg-purple-500/30"></div><div class="h-full w-[1px] bg-purple-500/30"></div></div>
                
                <!-- 數字點綴 (Neon Numbers) -->
                <span class="absolute text-purple-400 font-inter text-[12px] lg:text-[16px] font-semibold translate-x-[-18px] translate-y-[-18px] lg:translate-x-[-24px] lg:translate-y-[-24px]">5</span>
                <span class="absolute text-purple-300 font-inter text-[12px] lg:text-[16px] font-semibold translate-x-[18px] translate-y-[0px] lg:translate-x-[24px] lg:translate-y-[0px]">9</span>
                <span class="absolute text-purple-500 font-inter text-[12px] lg:text-[16px] font-bold translate-x-[0px] translate-y-[18px] lg:translate-x-[0px] lg:translate-y-[24px] shadow-[0_0_10px_rgba(168,85,247,0.8)]">3</span>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">數獨</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Sudoku</span>
            </div>
        </a>

    </div>
  </main>

  <footer class="flex-none w-full py-6 text-center text-neutral-600 text-[10px] tracking-[0.15em] uppercase z-10 animate-fade-in stagger-4 relative">
    © 2026 Board Games Hub. All rights reserved.
  </footer>

</body>
</html>
