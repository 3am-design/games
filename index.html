<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>中國象棋 - Board Games</title>
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }
    }
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    
    @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-thinking { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    /* --- 被食棋子擊飛動畫 --- */
    @keyframes captureFlyAway {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(0, -60px) scale(0.2) rotate(180deg); opacity: 0; }
    }
    .anim-capture-fly {
      animation: captureFlyAway 0.8s cubic-bezier(0.6, 0, 1, 1) forwards;
      transform-origin: center;
      pointer-events: none;
    }

    /* --- 擲先後 3D 硬幣動畫 --- */
    .coin-scene { perspective: 800px; width: 100px; height: 100px; }
    @media (min-width: 1024px) { .coin-scene { width: 120px; height: 120px; } }
    .coin-wrapper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
    .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Noto Sans TC', sans-serif; font-size: 2.25rem; border: 4px solid; background: #111; }
    @media (min-width: 1024px) { .coin-face { font-size: 3rem; } }
    .coin-front { background: #ef4444; border-color: #ef4444; transform: rotateY(0deg); }
    .coin-back { background: #ffffff; border-color: #ffffff; transform: rotateY(180deg); }

    @keyframes flipToRed {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(1800deg) scale(1.4); }
      100% { transform: rotateY(3600deg) scale(1); }
    }
    @keyframes flipToWhite {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(1890deg) scale(1.4); }
      100% { transform: rotateY(3780deg) scale(1); }
    }
    .anim-flip-red { animation: flipToRed 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .anim-flip-white { animation: flipToWhite 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes fadeInDelayed {
      0%, 75% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-in-delayed {
      animation: fadeInDelayed 2.2s ease-out forwards;
    }

    html, body { 
      overscroll-behavior-y: none; 
      background-color: #000000; 
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      margin: 0;
      touch-action: manipulation;
    }
    
    .app-container {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    button { 
      -webkit-tap-highlight-color: transparent; 
      outline: none;
      touch-action: manipulation;
    }

    /* 移除 iOS 點擊 SVG 元素時自帶的灰色高亮背景 */
    svg, .chess-piece, .valid-move {
      -webkit-tap-highlight-color: transparent;
    }

    .key-base { transition: background-color 0.2s ease-out, color 0.2s ease-out, border-color 0.2s, opacity 0.2s; }
    .key-base:active { opacity: 0.5; transition: none; }

    .chess-piece { cursor: pointer; transition: filter 0.2s ease; }
    @media (hover: hover) {
      .chess-piece:hover { filter: brightness(1.2); }
      .valid-move:hover { fill: rgba(255, 255, 255, 0.4); }
    }
    .valid-move { cursor: pointer; transition: fill 0.2s ease; }
    .font-chess { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
    
    /* Range Slider 手機優化 */
    input[type=range] { 
      -webkit-appearance: none; 
      appearance: none;
      width: 100%; 
      background: transparent; 
      outline: none;
      touch-action: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; 
      appearance: none;
      height: 24px; width: 24px; border-radius: 50%;
      background: #ffffff; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px rgba(255,255,255,0.5);
      position: relative; z-index: 50;
    }
    input[type=range]::-webkit-slider-runnable-track { 
      width: 100%; height: 4px; cursor: pointer; background: #333333; border-radius: 2px; 
    }
    input[type=range]::-moz-range-thumb {
      height: 24px; width: 24px; border-radius: 50%; border: none;
      background: #ffffff; cursor: pointer; box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    input[type=range]::-moz-range-track { 
      width: 100%; height: 4px; cursor: pointer; background: #333333; border-radius: 2px; 
    }
    
    /* 強制將 SVG 圖示轉為純白色 */
    .icon-white { filter: brightness(0) invert(1); }
  </style>
</head>
<body class="bg-black selection:bg-white/30">

  <div id="app" class="app-container"></div>

  <script>
    // --- 系統常數與初始設定 ---
    const GRID_SIZE = 40;
    const BOARD_WIDTH = 8; 
    const BOARD_HEIGHT = 9; 
    
    const PIECE_TEXT = {
      'R': { r: '車', h: '馬', e: '相', a: '仕', g: '帥', c: '炮', s: '兵' },
      'B': { r: '車', h: '馬', e: '象', a: '士', g: '將', c: '砲', s: '卒' }
    };
    const PIECE_VALUES = { 'g': 10000, 'r': 900, 'c': 450, 'h': 400, 'e': 200, 'a': 200, 's': 100 };

    // AI 三國武將隨機名單
    const AI_NAMES = ['呂布', '趙雲', '關羽', '張飛', '諸葛亮', '曹操', '司馬懿', '周瑜', '孫權', '馬超', '黃忠', '典韋', '夏侯惇', '張遼', '甘寧', '太史慈', '董卓', '陸遜'];

    const cloneState = (state) => JSON.parse(JSON.stringify(state));

    // --- 遊戲與系統狀態 ---
    let gameState = null;
    let historyStack = [];
    let isMenuOpen = true;
    let menuJustOpened = true;
    let isRecordOpen = false;
    let matchHistory = []; 
    let selectedHistoryMatch = null;
    
    let settings = {
      mode: 'PvE', 
      aiDifficulty: 5, 
      firstMove: 'PLAYER', 
      playerColor: 'R',
      player1Name: '',
      player2Name: ''
    };
    let pendingSettings = cloneState(settings);

    // 安全讀取 localStorage
    const loadHistory = () => {
      try {
        const saved = localStorage.getItem('chinese_chess_history');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) matchHistory = parsed;
        }
      } catch (e) {
        console.error("Failed to parse history data:", e);
        matchHistory = [];
      }
    };

    const saveHistory = () => {
      try {
        localStorage.setItem('chinese_chess_history', JSON.stringify(matchHistory));
      } catch (e) {
        console.error("Failed to save history:", e);
      }
    };

    const recordFinishedGame = () => {
      if (!gameState || !gameState.winner) return;
      const newMatchRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleString(),
        settings: cloneState(settings),
        gameLog: cloneState(gameState.gameLog),
        winner: gameState.winner
      };
      matchHistory.unshift(newMatchRecord); 
      if (matchHistory.length > 50) matchHistory.pop(); 
      saveHistory();
    };

    const getInitialBoard = () => {
      const board = Array(10).fill(null).map(() => Array(9).fill(null));
      const layout = [
        ['r', 'h', 'e', 'a', 'g', 'a', 'e', 'h', 'r'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', 'c', '.', '.', '.', '.', '.', 'c', '.'],
        ['s', '.', 's', '.', 's', '.', 's', '.', 's'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['S', '.', 'S', '.', 'S', '.', 'S', '.', 'S'],
        ['.', 'C', '.', '.', '.', '.', '.', 'C', '.'],
        ['.', '.', '.', '.', '.', '.', '.', '.', '.'],
        ['R', 'H', 'E', 'A', 'G', 'A', 'E', 'H', 'R']
      ];

      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 9; x++) {
          const char = layout[y][x];
          if (char !== '.') {
            const color = char === char.toUpperCase() ? 'R' : 'B';
            const type = char.toLowerCase();
            board[y][x] = { color, type, label: PIECE_TEXT[color][type] };
          }
        }
      }
      return board;
    };

    // --- 核心邏輯：規則引擎 ---
    const isInsidePalace = (x, y, color) => {
      if (x < 3 || x > 5) return false;
      if (color === 'B' && y > 2) return false;
      if (color === 'R' && y < 7) return false;
      return true;
    };

    const getValidMoves = (board, sx, sy) => {
      const piece = board[sy][sx];
      if (!piece) return [];
      const moves = [];
      const { color, type } = piece;

      const addMoveIfValid = (nx, ny) => {
        if (nx < 0 || nx > 8 || ny < 0 || ny > 9) return false;
        const target = board[ny][nx];
        if (!target || target.color !== color) moves.push({ x: nx, y: ny });
        return !target; 
      };

      if (type === 'r') {
        for (let x = sx + 1; x <= 8; x++) if (!addMoveIfValid(x, sy)) break;
        for (let x = sx - 1; x >= 0; x--) if (!addMoveIfValid(x, sy)) break;
        for (let y = sy + 1; y <= 9; y++) if (!addMoveIfValid(sx, y)) break;
        for (let y = sy - 1; y >= 0; y--) if (!addMoveIfValid(sx, y)) break;
      } 
      else if (type === 'h') {
        const dirs = [
          { dx: 1, dy: 2, bx: 0, by: 1 }, { dx: 2, dy: 1, bx: 1, by: 0 },
          { dx: 2, dy: -1, bx: 1, by: 0 }, { dx: 1, dy: -2, bx: 0, by: -1 },
          { dx: -1, dy: -2, bx: 0, by: -1 }, { dx: -2, dy: -1, bx: -1, by: 0 },
          { dx: -2, dy: 1, bx: -1, by: 0 }, { dx: -1, dy: 2, bx: 0, by: 1 }
        ];
        dirs.forEach(d => {
          if (sx + d.bx >= 0 && sx + d.bx <= 8 && sy + d.by >= 0 && sy + d.by <= 9 && !board[sy + d.by][sx + d.bx]) addMoveIfValid(sx + d.dx, sy + d.dy);
        });
      }
      else if (type === 'e') {
        const dirs = [{ dx: 2, dy: 2, bx: 1, by: 1 }, { dx: 2, dy: -2, bx: 1, by: -1 }, { dx: -2, dy: -2, bx: -1, by: -1 }, { dx: -2, dy: 2, bx: -1, by: 1 }];
        dirs.forEach(d => {
          const ny = sy + d.dy;
          if ((color === 'R' && ny < 5) || (color === 'B' && ny > 4)) return;
          if (sx + d.bx >= 0 && sx + d.bx <= 8 && sy + d.by >= 0 && sy + d.by <= 9 && !board[sy + d.by][sx + d.bx]) addMoveIfValid(sx + d.dx, ny);
        });
      }
      else if (type === 'a') {
        const dirs = [{ dx: 1, dy: 1 }, { dx: 1, dy: -1 }, { dx: -1, dy: 1 }, { dx: -1, dy: -1 }];
        dirs.forEach(d => {
          const nx = sx + d.dx, ny = sy + d.dy;
          if (isInsidePalace(nx, ny, color)) addMoveIfValid(nx, ny);
        });
      }
      else if (type === 'g') {
        const dirs = [{ dx: 0, dy: 1 }, { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: -1, dy: 0 }];
        dirs.forEach(d => {
          const nx = sx + d.dx, ny = sy + d.dy;
          if (isInsidePalace(nx, ny, color)) addMoveIfValid(nx, ny);
        });
        let searchDir = color === 'R' ? -1 : 1;
        for (let y = sy + searchDir; y >= 0 && y <= 9; y += searchDir) {
          if (board[y][sx]) {
            if (board[y][sx].type === 'g') moves.push({ x: sx, y });
            break;
          }
        }
      }
      else if (type === 'c') {
        const checkCannonDir = (dx, dy) => {
          let jumped = false;
          for (let i = 1; i < 10; i++) {
            const nx = sx + dx * i, ny = sy + dy * i;
            if (nx < 0 || nx > 8 || ny < 0 || ny > 9) break;
            const target = board[ny][nx];
            if (!jumped) {
              if (!target) moves.push({ x: nx, y: ny });
              else jumped = true;
            } else {
              if (target) {
                if (target.color !== color) moves.push({ x: nx, y: ny });
                break;
              }
            }
          }
        };
        checkCannonDir(1, 0); checkCannonDir(-1, 0); checkCannonDir(0, 1); checkCannonDir(0, -1);
      }
      else if (type === 's') {
        const dy = color === 'R' ? -1 : 1;
        addMoveIfValid(sx, sy + dy);
        if ((color === 'R' && sy < 5) || (color === 'B' && sy > 4)) {
          addMoveIfValid(sx - 1, sy); addMoveIfValid(sx + 1, sy);
        }
      }
      return moves;
    };

    // --- 電腦 AI 邏輯 ---
    const getAllMoves = (board, color) => {
      let moves = [];
      for (let y = 0; y <= 9; y++) {
        for (let x = 0; x <= 8; x++) {
          const p = board[y][x];
          if (p && p.color === color) {
            let vMoves = getValidMoves(board, x, y);
            vMoves.forEach(m => moves.push({ from: {x, y}, to: {x: m.x, y: m.y} }));
          }
        }
      }
      return moves;
    };

    const evaluateBoard = (board) => {
      let score = 0;
      const isPurgatory = settings.aiDifficulty >= 14;
      
      for (let y = 0; y <= 9; y++) {
        for (let x = 0; x <= 8; x++) {
          const p = board[y][x];
          if (p) {
            let val = PIECE_VALUES[p.type];
            let isBlack = p.color === 'B';
            let rank = isBlack ? y : 9 - y; 
            
            if (p.type === 's') {
              if (rank > 4) {
                val += 30 + (rank - 4) * 20; 
                if (x >= 2 && x <= 6) val += 20; 
                if (rank === 9) val -= 40; 
              }
            } else if (p.type === 'h') { 
              if (x > 0 && x < 8 && y > 0 && y < 9) val += 30; 
              if (rank > 4 && x > 1 && x < 7) val += 30; 
              if (isPurgatory && x >= 3 && x <= 5 && rank >= 5) val += 20; 
            } else if (p.type === 'r') { 
              if (x === 4 || x === 3 || x === 5) val += 25; 
              if (rank > 4) val += 20; 
            } else if (p.type === 'c') { 
              if (x === 4) val += 20; 
              if (rank === 2 || rank === 0) val += 10; 
              if (isPurgatory && x === 4 && rank >= 5) val += 30; 
            } else if (p.type === 'g') { 
              if (x === 4) val += 20; 
            }
            score += isBlack ? val : -val; 
          }
        }
      }
      return score;
    };

    const doMove = (board, move) => {
      const captured = board[move.to.y][move.to.x];
      board[move.to.y][move.to.x] = board[move.from.y][move.from.x];
      board[move.from.y][move.from.x] = null;
      return captured;
    };

    const undoMove = (board, move, captured) => {
      board[move.from.y][move.from.x] = board[move.to.y][move.to.x];
      board[move.to.y][move.to.x] = captured;
    };

    const minimax = (board, depth, alpha, beta, isMaximizing) => {
      if (depth === 0) return evaluateBoard(board);

      const color = isMaximizing ? 'B' : 'R';
      let moves = getAllMoves(board, color);

      moves.sort((a, b) => {
        let scoreA = board[a.to.y][a.to.x] ? PIECE_VALUES[board[a.to.y][a.to.x].type] : 0;
        let scoreB = board[b.to.y][b.to.x] ? PIECE_VALUES[board[b.to.y][b.to.x].type] : 0;
        return scoreB - scoreA; 
      });

      if (moves.length === 0) return isMaximizing ? -100000 : 100000;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < moves.length; i++) {
          let move = moves[i];
          let captured = doMove(board, move);
          let currentEval = 0;
          if (captured && captured.type === 'g') currentEval = 100000;
          else currentEval = minimax(board, depth - 1, alpha, beta, false);
          
          undoMove(board, move, captured);
          maxEval = Math.max(maxEval, currentEval);
          alpha = Math.max(alpha, currentEval);
          if (beta <= alpha) break; 
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < moves.length; i++) {
          let move = moves[i];
          let captured = doMove(board, move);
          let currentEval = 0;
          if (captured && captured.type === 'g') currentEval = -100000;
          else currentEval = minimax(board, depth - 1, alpha, beta, true);

          undoMove(board, move, captured);
          minEval = Math.min(minEval, currentEval);
          beta = Math.min(beta, currentEval);
          if (beta <= alpha) break; 
        }
        return minEval;
      }
    };

    const calculateAIMove = () => {
      const diff = settings.aiDifficulty;
      let depth = 1;
      let randomness = 0;

      if (diff <= 3) { depth = 2; randomness = 0.5 - (diff * 0.1); } 
      else if (diff <= 6) { depth = 3; randomness = 0.3 - ((diff-3) * 0.08); } 
      else if (diff <= 10) { depth = 4; randomness = 0.15 - ((diff-6) * 0.03); } 
      else if (diff <= 13) { depth = 4; randomness = 0; } 
      else { depth = 5; randomness = 0; } 

      const aiColor = 'B';
      let moves = getAllMoves(gameState.board, aiColor);
      
      if (moves.length === 0) return null;

      if (Math.random() < randomness) {
         return moves[Math.floor(Math.random() * moves.length)];
      }

      let bestMoves = [];
      const isMaximizing = true; 
      let bestValue = -Infinity;
      
      moves.sort((a, b) => {
        let scoreA = gameState.board[a.to.y][a.to.x] ? PIECE_VALUES[gameState.board[a.to.y][a.to.x].type] : 0;
        let scoreB = gameState.board[b.to.y][b.to.x] ? PIECE_VALUES[gameState.board[b.to.y][b.to.x].type] : 0;
        return scoreB - scoreA; 
      });

      for (let i = 0; i < moves.length; i++) {
        let move = moves[i];
        let captured = doMove(gameState.board, move);
        let moveValue = 0;
        
        if (captured && captured.type === 'g') {
           moveValue = 100000;
        } else {
           moveValue = minimax(gameState.board, depth - 1, -Infinity, Infinity, false);
        }

        undoMove(gameState.board, move, captured);

        if (moveValue > -50000 && moveValue < 50000) {
            moveValue += (Math.random() * 4 - 2); 
        }

        if (moveValue > bestValue) { 
            bestValue = moveValue; 
            bestMoves = [move]; 
        } else if (Math.abs(moveValue - bestValue) < 0.1) { 
            bestMoves.push(move); 
        }
      }
      return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    };

    const triggerAI = () => {
       const aiMove = calculateAIMove();
       if (aiMove) {
          gameState.isThinking = false;
          performMove(aiMove.from.x, aiMove.from.y, aiMove.to.x, aiMove.to.y);
       }
    };

    // --- 動畫與核心流程 ---
    const performMove = (sx, sy, tx, ty) => {
        historyStack.push(cloneState(gameState));
        
        const movingPiece = gameState.board[sy][sx];
        const targetPiece = gameState.board[ty][tx];

        const logEntry = { turn: gameState.turn, piece: movingPiece.label, from: { x: sx, y: sy }, to: { x: tx, y: ty }, captured: targetPiece ? targetPiece.label : null };
        gameState.gameLog.push(logEntry);

        gameState.board[ty][tx] = movingPiece;
        gameState.board[sy][sx] = null;
        
        gameState.lastMove = { from: {x: sx, y: sy}, to: {x: tx, y: ty} };
        gameState.isAnimating = true; 
        
        if (targetPiece) gameState.animatingCapture = targetPiece;

        gameState.selectedPiece = null;
        gameState.validMoves = [];
        
        render(); 

        setTimeout(() => {
            gameState.isAnimating = false;
            if (targetPiece) {
                gameState.showCaptureEffect = { x: tx, y: ty, piece: targetPiece, capturerColor: movingPiece.color };
                gameState.animatingCapture = null;
                render();
                setTimeout(() => {
                    gameState.showCaptureEffect = null;
                    completeMoveLogic(targetPiece);
                }, 800); 
            } else {
                completeMoveLogic(null);
            }
        }, 400); 
    };

    const completeMoveLogic = (targetPiece) => {
        if (targetPiece) {
            gameState.captured[gameState.turn].push(targetPiece);
            if (targetPiece.type === 'g') gameState.winner = gameState.turn;
        }

        if (!gameState.winner) {
            gameState.turn = gameState.turn === 'R' ? 'B' : 'R';
            if (gameState.turn === 'R') gameState.turnCount++;
        }

        render();

        if (gameState.winner) {
            recordFinishedGame();
            render();
        } else if (settings.mode === 'PvE' && gameState.turn === 'B') {
            gameState.isThinking = true;
            render();
            setTimeout(triggerAI, 1000);
        }
    };

    // --- 互動與控制 ---
    window.openMenu = () => { 
        pendingSettings = cloneState(settings);
        isMenuOpen = true; 
        isRecordOpen = false;
        render(); 
    };

    window.cancelMenu = () => { 
        isMenuOpen = false; 
        render(); 
    };

    // 局部更新設定狀態及渲染 Menu
    const updateMenuDOM = () => {
        const isPvE = pendingSettings.mode === 'PvE';
        
        const btnPve = document.getElementById('btn-mode-pve');
        const btnPvp = document.getElementById('btn-mode-pvp');
        if(btnPve) btnPve.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${isPvE ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnPvp) btnPvp.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${!isPvE ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        
        const pveSettings = document.getElementById('pve-settings');
        const emptySpace = document.getElementById('empty-space');
        if(pveSettings) pveSettings.style.display = isPvE ? 'flex' : 'none';
        if(emptySpace) emptySpace.style.display = isPvE ? 'none' : 'block';

        const p2Input = document.getElementById('input-p2');
        if(p2Input) p2Input.style.display = isPvE ? 'none' : 'block';
        const p1Input = document.getElementById('input-p1');
        if(p1Input) p1Input.placeholder = isPvE ? "你的名字" : "玩家 1";

        const btnFmPlayer = document.getElementById('btn-fm-player');
        const btnFmAi = document.getElementById('btn-fm-ai');
        const btnFmRandom = document.getElementById('btn-fm-random');
        if(btnFmPlayer) btnFmPlayer.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'PLAYER' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnFmAi) btnFmAi.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'AI' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;
        if(btnFmRandom) btnFmRandom.className = `flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'RANDOM' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}`;

        for (let i = 1; i <= 15; i++) {
            const btn = document.getElementById(`btn-diff-${i}`);
            if (btn) {
                const isActive = i === pendingSettings.aiDifficulty;
                let baseClass = "flex items-center justify-center py-2 lg:py-2.5 rounded text-[12px] lg:text-[14px] transition-colors key-base ";
                if (i <= 10) {
                    btn.className = baseClass + (isActive ? 'bg-white text-black font-bold' : 'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900 hover:text-white');
                } else if (i <= 13) {
                    btn.className = baseClass + (isActive ? 'bg-red-600 text-white font-bold border border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.4)]' : 'bg-[#111] text-red-500/70 font-medium border border-red-900/50 hover:bg-red-950/30 hover:text-red-500');
                } else {
                    btn.className = baseClass + (isActive ? 'bg-purple-600 text-white font-bold border border-purple-600 shadow-[0_0_10px_rgba(147,51,234,0.5)]' : 'bg-[#111] text-purple-500/70 font-medium border border-purple-900/50 hover:bg-purple-900/30 hover:text-purple-400');
                }
            }
        }

        let diffLabel = "普通 (LV.5)";
        if (pendingSettings.aiDifficulty <= 3) diffLabel = `新手 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 7) diffLabel = `進階 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 10) diffLabel = `大師 (LV.${pendingSettings.aiDifficulty})`;
        else if (pendingSettings.aiDifficulty <= 13) diffLabel = `地獄 HELL (LV.${pendingSettings.aiDifficulty})`;
        else diffLabel = `煉獄 PURGATORY (LV.${pendingSettings.aiDifficulty})`;
        
        const diffLabelEl = document.getElementById('ai-diff-label');
        if (diffLabelEl) {
            if (pendingSettings.aiDifficulty >= 14) diffLabelEl.className = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
            else if (pendingSettings.aiDifficulty > 10) diffLabelEl.className = 'text-red-500 font-black tracking-widest';
            else diffLabelEl.className = 'text-white font-bold';
            diffLabelEl.innerText = diffLabel;
        }
    };

    window.setSetting = (key, value) => {
        if (pendingSettings) {
            pendingSettings[key] = value;
            updateMenuDOM();
        }
    };

    window.setPlayerName = (key, value) => {
        if (pendingSettings) pendingSettings[key] = value;
    };

    window.setDifficulty = (val) => { 
        if (pendingSettings) {
            pendingSettings.aiDifficulty = val; 
            updateMenuDOM();
        }
    };
    
    window.toggleRecord = () => { isRecordOpen = !isRecordOpen; selectedHistoryMatch = null; render(); };
    
    window.viewMatchDetail = (matchId) => {
      if (matchId === 'current') selectedHistoryMatch = 'current';
      else selectedHistoryMatch = matchHistory.find(m => m.id === matchId);
      render();
    };

    window.initGame = () => {
      isMenuOpen = false;
      isRecordOpen = false;
      
      if (pendingSettings) settings = cloneState(pendingSettings);
      settings.playerColor = 'R'; 

      const p1Name = settings.player1Name.trim() || (settings.mode === 'PvE' ? 'YOU' : 'P1');
      const aiName = AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
      const p2Name = settings.mode === 'PvE' ? aiName : (settings.player2Name.trim() || 'P2');

      gameState = {
        board: getInitialBoard(), turn: 'R', selectedPiece: null, validMoves: [], winner: null,
        captured: { 'R': [], 'B': [] }, turnCount: 1, isThinking: false, isAnimating: false,
        animatingCapture: null, showCaptureEffect: null, lastMove: null, gameLog: [], isTossing: false,
        redName: p1Name,
        whiteName: p2Name,
        startingTurn: 'R' 
      };
      historyStack = [];

      if (settings.mode === 'PvE') {
          if (settings.firstMove === 'RANDOM') {
              gameState.isTossing = true;
              gameState.turn = Math.random() < 0.5 ? 'R' : 'B';
              gameState.startingTurn = gameState.turn;
              render(); 
              setTimeout(() => {
                  gameState.isTossing = false;
                  render();
                  if (gameState.turn === 'B') { 
                      gameState.isThinking = true;
                      render();
                      setTimeout(triggerAI, 1000);
                  }
              }, 3500); 
              return;
          } else {
              gameState.turn = settings.firstMove === 'AI' ? 'B' : 'R';
              gameState.startingTurn = gameState.turn;
              if (gameState.turn === 'B') {
                  gameState.isThinking = true;
                  setTimeout(() => { 
                      render(); 
                      setTimeout(triggerAI, 1000); 
                  }, 0);
              }
          }
      } else {
          gameState.startingTurn = 'R';
      }
      render();
    };

    window.handleUndo = () => {
      if (historyStack.length === 0 || gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.showCaptureEffect || gameState.isTossing) return;
      if (settings.mode === 'PvE') {
         if (historyStack.length >= 2) { historyStack.pop(); gameState = historyStack.pop(); }
      } else {
         gameState = historyStack.pop();
      }
      gameState.lastMove = null; gameState.isAnimating = false; gameState.showCaptureEffect = null;
      render();
    };

    window.handleSquareClick = (x, y) => {
      if (gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.showCaptureEffect || gameState.isTossing) return;
      
      const piece = gameState.board[y][x];
      const isSelected = gameState.selectedPiece && gameState.selectedPiece.x === x && gameState.selectedPiece.y === y;

      if (isSelected) { gameState.selectedPiece = null; gameState.validMoves = []; render(); return; }

      const isValidMove = gameState.validMoves.find(m => m.x === x && m.y === y);
      if (gameState.selectedPiece && isValidMove) { performMove(gameState.selectedPiece.x, gameState.selectedPiece.y, x, y); return; }

      if (piece && piece.color === gameState.turn) {
        if (settings.mode === 'PvE' && piece.color !== settings.playerColor) return;
        gameState.selectedPiece = { x, y };
        gameState.validMoves = getValidMoves(gameState.board, x, y);
        render();
      } else {
        gameState.selectedPiece = null; gameState.validMoves = []; render();
      }
    };

    // --- 獨立 Menu 渲染 ---
    const getMenuHTML = () => {
      if (!isMenuOpen) return '';
      const isPvE = pendingSettings.mode === 'PvE';
      let diffLabel = "普通 (LV.5)";
      if (pendingSettings.aiDifficulty <= 3) diffLabel = `新手 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 7) diffLabel = `進階 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 10) diffLabel = `大師 (LV.${pendingSettings.aiDifficulty})`;
      else if (pendingSettings.aiDifficulty <= 13) diffLabel = `地獄 HELL (LV.${pendingSettings.aiDifficulty})`;
      else diffLabel = `煉獄 PURGATORY (LV.${pendingSettings.aiDifficulty})`;
      
      let diffColor = 'text-white font-bold';
      if (pendingSettings.aiDifficulty >= 14) diffColor = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
      else if (pendingSettings.aiDifficulty > 10) diffColor = 'text-red-500 font-black tracking-widest';

      const closeBtnHTML = gameState 
        ? `<button onclick="window.cancelMenu()" class="text-white text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-neutral-300 transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white"></button>`
        : `<div class="h-[12px] lg:h-[15px] pt-1 lg:pt-1.5"></div>`;

      let diffGridHTML = '<div class="grid grid-cols-5 gap-1.5 lg:gap-2 w-full mt-1">';
      for (let i = 1; i <= 15; i++) {
          const isActive = pendingSettings.aiDifficulty === i;
          let btnClass = "diff-btn flex items-center justify-center py-2 lg:py-2.5 rounded text-[12px] lg:text-[14px] transition-colors key-base ";
          if (i <= 10) {
              btnClass += isActive ? 'bg-white text-black font-bold' : 'bg-[#111] text-neutral-400 font-medium border border-neutral-800 hover:bg-neutral-900 hover:text-white';
          } else if (i <= 13) {
              btnClass += isActive ? 'bg-red-600 text-white font-bold border border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.4)]' : 'bg-[#111] text-red-500/70 font-medium border border-red-900/50 hover:bg-red-950/30 hover:text-red-500';
          } else {
              btnClass += isActive ? 'bg-purple-600 text-white font-bold border border-purple-600 shadow-[0_0_10px_rgba(147,51,234,0.5)]' : 'bg-[#111] text-purple-500/70 font-medium border border-purple-900/50 hover:bg-purple-900/30 hover:text-purple-400';
          }
          diffGridHTML += `<button id="btn-diff-${i}" data-val="${i}" onclick="window.setDifficulty(${i})" class="${btnClass}">${i}</button>`;
      }
      diffGridHTML += '</div>';

      return `
        <div id="menu-layer" class="fixed inset-0 z-50 bg-black flex flex-col overflow-y-auto ${menuJustOpened ? 'animate-fade-in' : ''}">
          <header class="flex-none pt-6 pb-2 px-5 lg:px-12 flex items-start justify-end z-30 w-full shrink-0">
            ${closeBtnHTML}
          </header>
          <div class="flex-1 flex flex-col items-center justify-center gap-8 pb-10 px-6 w-full mt-4 lg:mt-0">
            <div class="flex flex-col items-center justify-center gap-3 mb-2">
               <img src="./assets/Logo.svg" alt="CHESS" class="h-[22px] lg:h-[28px] object-contain opacity-90 icon-white">
               <div class="text-white font-chess tracking-[0.4em] text-[13px] lg:text-[15px] font-light opacity-60">中國象棋</div>
            </div>

            <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3">
              <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase">GAME MODE</div>
              <div class="flex w-full gap-2">
                <button id="btn-mode-pve" data-val="PvE" onclick="window.setSetting('mode', 'PvE')" class="mode-btn flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.mode === 'PvE' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">單人 (對電腦)</button>
                <button id="btn-mode-pvp" data-val="PvP" onclick="window.setSetting('mode', 'PvP')" class="mode-btn flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.mode === 'PvP' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">雙人 (對戰)</button>
              </div>
            </div>

            <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3">
              <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase w-full text-center">PLAYER NAME</div>
              <div class="flex w-full gap-2">
                <input type="text" id="input-p1" value="${pendingSettings.player1Name}" oninput="window.setPlayerName('player1Name', this.value)" placeholder="${isPvE ? '你的名字' : '玩家 1'}" class="flex-1 min-w-0 bg-[#111] border border-neutral-800 rounded-lg py-3.5 px-4 text-[12px] lg:text-[14px] text-white text-center focus:outline-none focus:border-neutral-500 transition-colors placeholder-neutral-600 font-medium tracking-widest">
                <input type="text" id="input-p2" value="${pendingSettings.player2Name}" oninput="window.setPlayerName('player2Name', this.value)" placeholder="玩家 2" class="flex-1 min-w-0 bg-[#111] border border-neutral-800 rounded-lg py-3.5 px-4 text-[12px] lg:text-[14px] text-white text-center focus:outline-none focus:border-neutral-500 transition-colors placeholder-neutral-600 font-medium tracking-widest" style="display: ${isPvE ? 'none' : 'block'}">
              </div>
            </div>

            <div id="pve-settings" class="w-full flex-col items-center gap-3 animate-fade-in" style="display: ${isPvE ? 'flex' : 'none'}">
              <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3 mt-1">
                <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase flex justify-between w-full">
                  <span>AI DIFFICULTY</span>
                  <span id="ai-diff-label" class="${diffColor}">${diffLabel}</span>
                </div>
                ${diffGridHTML}
              </div>
              <div class="w-full max-w-[340px] lg:max-w-[440px] flex flex-col items-center gap-3 mt-2">
                <div class="text-neutral-500 text-[10px] lg:text-[13px] font-medium tracking-[0.15em] uppercase">FIRST MOVE</div>
                <div class="flex w-full gap-2">
                  <button id="btn-fm-player" data-val="PLAYER" onclick="window.setSetting('firstMove', 'PLAYER')" class="fm-btn flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'PLAYER' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">先攻</button>
                  <button id="btn-fm-ai" data-val="AI" onclick="window.setSetting('firstMove', 'AI')" class="fm-btn flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'AI' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">後攻</button>
                  <button id="btn-fm-random" data-val="RANDOM" onclick="window.setSetting('firstMove', 'RANDOM')" class="fm-btn flex-1 py-3.5 lg:py-4 rounded-lg text-[11px] lg:text-[14px] tracking-[0.15em] uppercase key-base ${pendingSettings.firstMove === 'RANDOM' ? 'bg-white text-black font-bold' : 'bg-black text-white font-medium border border-neutral-800 hover:bg-neutral-900'}">隨機</button>
                </div>
              </div>
            </div>
            
            <div id="empty-space" class="h-[120px] w-full max-w-[340px] lg:max-w-[440px]" style="display: ${!isPvE ? 'block' : 'none'}"></div>
            <div class="w-full max-w-[340px] lg:max-w-[440px] mt-2">
              <button onclick="window.initGame()" class="w-full bg-white hover:bg-neutral-200 active:bg-neutral-300 text-black py-4 lg:py-5 rounded-lg font-bold tracking-[0.15em] text-[12px] lg:text-[16px] uppercase key-base">${gameState ? "RESTART 重新開始" : "開始新棋局"}</button>
            </div>
          </div>
        </div>
      `;
    };

    // --- 渲染 SVG ---
    const generateBoardSVG = () => {
      const OFFSET_X = 20; const OFFSET_Y = 20;
      let svg = `<g stroke="#475569" stroke-width="1">`;

      for (let i = 0; i <= BOARD_HEIGHT; i++) svg += `<line x1="${OFFSET_X}" y1="${OFFSET_Y + i * GRID_SIZE}" x2="${OFFSET_X + BOARD_WIDTH * GRID_SIZE}" y2="${OFFSET_Y + i * GRID_SIZE}" />`;
      for (let i = 0; i <= BOARD_WIDTH; i++) {
        svg += `<line x1="${OFFSET_X + i * GRID_SIZE}" y1="${OFFSET_Y}" x2="${OFFSET_X + i * GRID_SIZE}" y2="${OFFSET_Y + 4 * GRID_SIZE}" />`;
        if (i === 0 || i === BOARD_WIDTH) svg += `<line x1="${OFFSET_X + i * GRID_SIZE}" y1="${OFFSET_Y + 4 * GRID_SIZE}" x2="${OFFSET_X + i * GRID_SIZE}" y2="${OFFSET_Y + 5 * GRID_SIZE}" />`;
        svg += `<line x1="${OFFSET_X + i * GRID_SIZE}" y1="${OFFSET_Y + 5 * GRID_SIZE}" x2="${OFFSET_X + i * GRID_SIZE}" y2="${OFFSET_Y + BOARD_HEIGHT * GRID_SIZE}" />`;
      }

      svg += `<line x1="${OFFSET_X + 3 * GRID_SIZE}" y1="${OFFSET_Y}" x2="${OFFSET_X + 5 * GRID_SIZE}" y2="${OFFSET_Y + 2 * GRID_SIZE}" />`;
      svg += `<line x1="${OFFSET_X + 5 * GRID_SIZE}" y1="${OFFSET_Y}" x2="${OFFSET_X + 3 * GRID_SIZE}" y2="${OFFSET_Y + 2 * GRID_SIZE}" />`;
      svg += `<line x1="${OFFSET_X + 3 * GRID_SIZE}" y1="${OFFSET_Y + 7 * GRID_SIZE}" x2="${OFFSET_X + 5 * GRID_SIZE}" y2="${OFFSET_Y + 9 * GRID_SIZE}" />`;
      svg += `<line x1="${OFFSET_X + 5 * GRID_SIZE}" y1="${OFFSET_Y + 7 * GRID_SIZE}" x2="${OFFSET_X + 3 * GRID_SIZE}" y2="${OFFSET_Y + 9 * GRID_SIZE}" />`;

      svg += `</g>
        <text x="${OFFSET_X + 2 * GRID_SIZE}" y="${OFFSET_Y + 4.5 * GRID_SIZE}" fill="#475569" opacity="0.5" font-weight="400" font-size="20" class="font-chess" text-anchor="middle" dominant-baseline="central">楚 河</text>
        <text x="${OFFSET_X + 6 * GRID_SIZE}" y="${OFFSET_Y + 4.5 * GRID_SIZE}" fill="#475569" opacity="0.5" font-weight="400" font-size="20" class="font-chess" text-anchor="middle" dominant-baseline="central">漢 界</text>
      `;

      const drawCross = (x, y) => {
        const cx = OFFSET_X + x * GRID_SIZE; const cy = OFFSET_Y + y * GRID_SIZE;
        const s = 4, l = 10; let res = `<g stroke="#475569" stroke-width="1">`;
        if (x > 0) res += `<polyline points="${cx-l},${cy-s} ${cx-s},${cy-s} ${cx-s},${cy-l}" fill="none"/><polyline points="${cx-l},${cy+s} ${cx-s},${cy+s} ${cx-s},${cy+l}" fill="none"/>`;
        if (x < 8) res += `<polyline points="${cx+l},${cy-s} ${cx+s},${cy-s} ${cx+s},${cy-l}" fill="none"/><polyline points="${cx+l},${cy+s} ${cx+s},${cy+s} ${cx+s},${cy+l}" fill="none"/>`;
        return res + `</g>`;
      };
      [ {x:1, y:2}, {x:7, y:2}, {x:0, y:3}, {x:2, y:3}, {x:4, y:3}, {x:6, y:3}, {x:8, y:3}, {x:1, y:7}, {x:7, y:7}, {x:0, y:6}, {x:2, y:6}, {x:4, y:6}, {x:6, y:6}, {x:8, y:6} ].forEach(pos => svg += drawCross(pos.x, pos.y));

      let interactionSVG = `<g opacity="0">`;
      for (let y = 0; y <= BOARD_HEIGHT; y++) {
        for (let x = 0; x <= BOARD_WIDTH; x++) {
          interactionSVG += `<rect x="${OFFSET_X + x * GRID_SIZE - 20}" y="${OFFSET_Y + y * GRID_SIZE - 20}" width="40" height="40" fill="transparent" onclick="window.handleSquareClick(${x}, ${y})" style="cursor:pointer;" />`;
        }
      }
      interactionSVG += `</g>`;

      let validMovesSVG = ``;
      gameState.validMoves.forEach(m => {
        const cx = OFFSET_X + m.x * GRID_SIZE; const cy = OFFSET_Y + m.y * GRID_SIZE;
        const isCapture = gameState.board[m.y][m.x] !== null;
        if (isCapture) {
          validMovesSVG += `<path d="M ${cx-15} ${cy-15} L ${cx-8} ${cy-15} M ${cx-15} ${cy-15} L ${cx-15} ${cy-8} M ${cx+15} ${cy-15} L ${cx+8} ${cy-15} M ${cx+15} ${cy-15} L ${cx+15} ${cy-8} M ${cx-15} ${cy+15} L ${cx-8} ${cy+15} M ${cx-15} ${cy+15} L ${cx-15} ${cy+8} M ${cx+15} ${cy+15} L ${cx+8} ${cy+15} M ${cx+15} ${cy+15} L ${cx+15} ${cy+8}" fill="none" stroke="#22d3ee" stroke-width="2" class="valid-move" onclick="window.handleSquareClick(${m.x}, ${m.y})" />`;
        } else {
          validMovesSVG += `<circle cx="${cx}" cy="${cy}" r="6" fill="#22d3ee" opacity="0.6" class="valid-move" onclick="window.handleSquareClick(${m.x}, ${m.y})" />`;
        }
      });

      let baseTargetPieceSVG = '';
      if (gameState.isAnimating && gameState.animatingCapture) {
          const cx = OFFSET_X + gameState.lastMove.to.x * GRID_SIZE; const cy = OFFSET_Y + gameState.lastMove.to.y * GRID_SIZE;
          const p = gameState.animatingCapture;
          const strokeColor = p.color === 'R' ? '#ef4444' : '#f8fafc';
          const textColor = p.color === 'R' ? '#ef4444' : '#f8fafc';
          baseTargetPieceSVG += `<g transform="translate(${cx}, ${cy})" pointer-events="none"><circle cx="0" cy="0" r="16" fill="#111111" stroke="${strokeColor}" stroke-width="1.5" /><circle cx="0" cy="0" r="13" fill="none" stroke="${strokeColor}" stroke-width="0.5" opacity="0.5" /><text x="0" y="0" fill="${textColor}" font-size="18" class="font-chess" text-anchor="middle" dominant-baseline="central">${p.label}</text></g>`;
      }

      let piecesSVG = ``;
      for (let y = 0; y <= BOARD_HEIGHT; y++) {
        for (let x = 0; x <= BOARD_WIDTH; x++) {
          const piece = gameState.board[y][x];
          if (piece) {
            const cx = OFFSET_X + x * GRID_SIZE; const cy = OFFSET_Y + y * GRID_SIZE;
            const isSelected = gameState.selectedPiece && gameState.selectedPiece.x === x && gameState.selectedPiece.y === y;
            const bgColor = '#111111'; const strokeColor = piece.color === 'R' ? '#ef4444' : '#f8fafc'; const textColor = piece.color === 'R' ? '#ef4444' : '#f8fafc';
            
            // 修正光環坐標問題：因為已經在 <g> 裡面用了 translate，所以這裡 cx/cy 必須是 0
            const glow = isSelected ? `<circle cx="0" cy="0" r="18" fill="none" stroke="#22d3ee" stroke-width="2" />` : '';
            
            let animTag = '';
            if (gameState.isAnimating && gameState.lastMove && gameState.lastMove.to.x === x && gameState.lastMove.to.y === y) {
                const oldCx = OFFSET_X + gameState.lastMove.from.x * GRID_SIZE; const oldCy = OFFSET_Y + gameState.lastMove.from.y * GRID_SIZE;
                animTag = `<animateTransform attributeName="transform" type="translate" from="${oldCx - cx} ${oldCy - cy}" to="0 0" dur="0.4s" additive="sum" fill="freeze" />`;
            }
            piecesSVG += `<g class="chess-piece" transform="translate(${cx}, ${cy})" onclick="window.handleSquareClick(${x}, ${y})">${animTag}${glow}<circle cx="0" cy="0" r="16" fill="${bgColor}" stroke="${strokeColor}" stroke-width="1.5" /><circle cx="0" cy="0" r="13" fill="none" stroke="${strokeColor}" stroke-width="0.5" opacity="0.5" /><text x="0" y="0" fill="${textColor}" font-size="18" class="font-chess" text-anchor="middle" dominant-baseline="central">${piece.label}</text></g>`;
          }
        }
      }

      let captureEffectsSVG = '';
      if (gameState.showCaptureEffect) {
          const cx = OFFSET_X + gameState.showCaptureEffect.x * GRID_SIZE; const cy = OFFSET_Y + gameState.showCaptureEffect.y * GRID_SIZE;
          const p = gameState.showCaptureEffect.piece; const waveColor = gameState.showCaptureEffect.capturerColor === 'R' ? '#ef4444' : '#f8fafc';
          const strokeColor = p.color === 'R' ? '#ef4444' : '#f8fafc'; const textColor = p.color === 'R' ? '#ef4444' : '#f8fafc';
          captureEffectsSVG += `<g pointer-events="none"><circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="${waveColor}" stroke-width="6"><animate attributeName="r" from="16" to="240" dur="0.8s" calcMode="spline" keyTimes="0; 1" keySplines="0.6 0 1 1" fill="freeze" /><animate attributeName="stroke-width" from="6" to="0" dur="0.8s" calcMode="spline" keyTimes="0; 1" keySplines="0.6 0 1 1" fill="freeze" /><animate attributeName="opacity" from="0.8" to="0" dur="0.8s" calcMode="spline" keyTimes="0; 1" keySplines="0.6 0 1 1" fill="freeze" /></circle><g transform="translate(${cx}, ${cy})"><g class="anim-capture-fly"><circle cx="0" cy="0" r="16" fill="#111111" stroke="${strokeColor}" stroke-width="1.5" /><circle cx="0" cy="0" r="13" fill="none" stroke="${strokeColor}" stroke-width="0.5" opacity="0.5" /><text x="0" y="0" fill="${textColor}" font-size="18" class="font-chess" text-anchor="middle" dominant-baseline="central">${p.label}</text></g></g></g>`;
      }

      return svg + interactionSVG + validMovesSVG + baseTargetPieceSVG + piecesSVG + captureEffectsSVG;
    };

    function render() {
      const appDiv = document.getElementById('app');
      
      const menuHTML = getMenuHTML();

      if (!gameState) {
          appDiv.innerHTML = menuHTML;
          return;
      }

      // 歷史紀錄介面
      let recordHTML = '';
      if (isRecordOpen) {
        if (!selectedHistoryMatch) {
          let historyListHTML = matchHistory.map(m => `
            <div onclick="window.viewMatchDetail(${m.id})" class="bg-[#111] rounded-lg p-5 border border-neutral-800 hover:border-neutral-600 transition-colors cursor-pointer group flex items-center justify-between">
               <div class="flex flex-col gap-1">
                  <div class="text-[12px] lg:text-[15px] font-bold ${m.winner === 'R' ? 'text-red-500' : 'text-slate-100'} tracking-wider">${m.winner === 'R' ? '紅方' : '白方'} 獲勝</div>
                  <div class="text-[9px] lg:text-[11px] text-neutral-500 uppercase tracking-widest">${m.settings.mode} | ${m.settings.mode === 'PvE' ? `LV.${m.settings.aiDifficulty}` : 'PVP'} | 回合: ${Math.ceil(m.gameLog.length / 2)}</div>
                  <div class="text-[8px] lg:text-[10px] text-neutral-600 font-medium">${m.timestamp}</div>
               </div>
               <img src="./assets/arrow.svg" alt="Detail" class="h-[10px] lg:h-[12px] opacity-20 group-hover:opacity-100 transition-opacity -rotate-90 icon-white">
            </div>
          `).join('');

          const currentEntry = gameState.gameLog.length > 0 ? `
            <div onclick="window.viewMatchDetail('current')" class="bg-[#1a1a1a] rounded-lg p-5 border-2 border-dashed border-neutral-700 hover:border-white transition-colors cursor-pointer mb-4 flex items-center justify-between">
               <div class="flex flex-col gap-1">
                  <div class="text-[14px] lg:text-[17px] font-bold text-white tracking-wide">當前賽局 (Current Match)</div>
                  <div class="text-[9px] lg:text-[11px] text-neutral-400 uppercase tracking-widest">In Progress...</div>
               </div>
               <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
            </div>
          ` : '';

          recordHTML = `
          <div class="fixed inset-0 z-50 bg-black flex flex-col overflow-hidden animate-fade-in">
            <header class="flex-none pt-6 pb-4 px-5 lg:px-12 flex items-start justify-center z-30 w-full border-b border-neutral-800 shrink-0 relative">
               <div class="text-white font-bold tracking-[0.15em] text-[12px] lg:text-[16px] uppercase pt-0.5">MATCH RECORD</div>
               <button onclick="window.toggleRecord()" class="absolute right-5 lg:right-12 text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white active:text-white transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white"></button>
            </header>
            <div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pt-6 pb-10 px-5 max-w-[800px] w-full mx-auto">
              ${currentEntry}
              <div class="flex flex-col gap-3">${historyListHTML || '<div class="text-center py-20 text-neutral-700 tracking-widest text-[11px] uppercase">No History Found</div>'}</div>
            </div>
          </div>
          `;
        } else {
          let matchData = selectedHistoryMatch === 'current' ? { settings, gameLog: cloneState(gameState.gameLog), isLive: true } : selectedHistoryMatch;
          let logContent = matchData.gameLog.slice().reverse().map((log, idx) => {
              const actualIdx = matchData.gameLog.length - idx;
              const colorClass = log.turn === 'R' ? 'text-red-500' : 'text-slate-100';
              const teamName = log.turn === 'R' ? '紅' : '白';
              const moveDesc = `${log.piece} : (${log.from.x + 1}, ${log.from.y + 1}) ➔ (${log.to.x + 1}, ${log.to.y + 1})`;
              const captureLabel = log.captured ? `<span class="ml-2 text-[10px] bg-red-500/20 text-red-400 px-1.5 py-0.5 rounded font-bold uppercase border border-red-500/30">食 ${log.captured}</span>` : '';
              return `
              <div class="flex items-center justify-between py-3 lg:py-4 border-b border-neutral-800/50 last:border-0">
                  <div class="flex items-center gap-3">
                      <div class="text-[10px] text-neutral-600 font-bold w-6">#${actualIdx}</div>
                      <div class="w-6 h-6 rounded border border-neutral-700 bg-neutral-800 flex items-center justify-center ${colorClass} text-[12px] font-chess">${teamName}</div>
                      <div class="text-[12px] lg:text-[14px] font-medium text-neutral-300 tracking-wide">${moveDesc}</div>
                  </div>
                  <div>${captureLabel}</div>
              </div>`;
          }).join('');

          recordHTML = `
          <div class="fixed inset-0 z-50 bg-black flex flex-col overflow-hidden animate-fade-in">
            <header class="flex-none pt-6 pb-4 px-5 lg:px-12 flex items-start justify-between z-30 w-full border-b border-neutral-800 shrink-0">
               <button onclick="window.viewMatchDetail(null)" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white transition-colors pt-1 lg:pt-1.5 flex items-center gap-1.5 key-base"><img src="./assets/arrow.svg" alt="<" class="h-[8px] rotate-90 opacity-60 icon-white"> BACK</button>
               <div class="flex flex-col items-center">
                 <span class="text-white font-black tracking-[0.2em] text-[12px] lg:text-[16px] uppercase pt-0.5">LOG DETAIL</span>
                 <span class="text-[8px] text-neutral-600 tracking-widest uppercase">${matchData.isLive ? 'LIVE' : 'PAST MATCH'}</span>
               </div>
               <button onclick="window.toggleRecord()" class="text-neutral-400 text-[11px] lg:text-[14px] font-medium tracking-[0.15em] uppercase hover:text-white active:text-white transition-colors pt-1 lg:pt-1.5 key-base"><img src="./assets/close.svg" alt="X" class="h-[12px] lg:h-[15px] icon-white"></button>
            </header>
            <div class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pt-4 pb-10 px-5 max-w-[800px] w-full mx-auto">
              <div class="bg-[#111] rounded-lg p-4 lg:p-6 border border-neutral-800 shadow-sm flex flex-col">${logContent || '<div class="text-neutral-600 text-center py-10 text-xs">暫無步數</div>'}</div>
            </div>
          </div>
          `;
        }
      }

      // --- 擲先後 3D 動畫過場 ---
      let tossHTML = '';
      if (gameState.isTossing) {
         const tossMsg = gameState.turn === 'R' ? `${gameState.redName} 先攻` : `${gameState.whiteName} 先攻`;
         const flipClass = gameState.turn === 'R' ? "anim-flip-red" : "anim-flip-white";
         
         tossHTML = `
         <div class="fixed inset-0 z-[60] bg-black/95 flex flex-col items-center justify-center">
            <div class="coin-scene mb-12 shadow-[0_0_30px_rgba(255,255,255,0.1)] rounded-full">
               <div class="coin-wrapper ${flipClass}">
                  <div class="coin-face coin-front"></div>
                  <div class="coin-face coin-back"></div>
               </div>
            </div>
            <div class="text-white font-bold tracking-[0.2em] text-[18px] lg:text-[22px] opacity-0 anim-fade-in-delayed uppercase">
               ${tossMsg}
            </div>
         </div>
         `;
      }

      // --- 主界面渲染 ---
      let statusBannerHTML = '';
      if (gameState.winner) {
        const winnerDisplay = gameState.winner === 'R' ? gameState.redName : gameState.whiteName;
        statusBannerHTML = `<div class="w-full ${gameState.winner === 'R' ? 'bg-[#6a0404]' : 'bg-[#333333]'} rounded-lg py-3.5 flex items-center justify-center font-bold text-[14px] lg:text-[17px] tracking-[0.15em] text-white uppercase animate-pulse shadow-lg">${winnerDisplay} 獲勝 WIN!!!</div>`;
      } else {
        const isPVE = settings.mode === 'PvE';
        let rightContent = '';
        let borderClass = 'border-neutral-800';

        if (isPVE) {
            if (gameState.turn === settings.playerColor) {
                // 玩家回合: YOUR TURN
                rightContent = `<span class="text-red-500 font-bold tracking-wider uppercase">${gameState.redName} TURN</span>`;
            } else {
                if (gameState.isThinking) {
                    rightContent = `<div class="flex items-center gap-3"><span class="text-white font-bold tracking-wider uppercase">${gameState.whiteName} TURN</span><span class="text-[#22d3ee] font-bold animate-pulse tracking-widest">THINKING...</span></div>`;
                    borderClass = 'border-[#22d3ee]/30 shadow-[0_0_15px_rgba(34,211,238,0.1)]';
                } else {
                    rightContent = `<span class="text-white font-bold tracking-wider uppercase">${gameState.whiteName} TURN</span>`;
                }
            }
        } else {
            // PvP 模式
            if (gameState.turn === 'R') {
                rightContent = `<span class="text-red-500 font-bold tracking-wider uppercase">${gameState.redName} TURN</span>`;
            } else {
                rightContent = `<span class="text-white font-bold tracking-wider uppercase">${gameState.whiteName} TURN</span>`;
            }
        }

        statusBannerHTML = `<div class="w-full bg-[#111111] rounded-lg py-3.5 lg:py-4 flex items-center justify-between px-6 font-medium text-[12px] lg:text-[16px] tracking-[0.15em] text-neutral-300 uppercase border ${borderClass} transition-colors duration-300"><span>TURN ${gameState.turnCount}</span>${rightContent}</div>`;
      }

      const renderCaptured = (color) => {
        const pieces = gameState.captured[color];
        if (pieces.length === 0) return '<div class="text-neutral-600 text-[10px] uppercase tracking-widest py-1">NONE</div>';
        return pieces.map(p => `<div class="w-6 h-6 rounded-full border border-neutral-700 bg-black flex items-center justify-center ${p.color === 'R' ? 'text-red-500' : 'text-slate-100'} text-[12px] font-chess">${p.label}</div>`).join('');
      };

      const capturedAreaHTML = `
        <div class="flex flex-col gap-3 px-4 lg:px-6 w-full">
            <div class="flex items-center justify-between bg-[#0a0a0a] border border-neutral-800 rounded-lg p-3">
              <div class="text-[10px] lg:text-[12px] text-neutral-500 font-medium tracking-[0.15em] uppercase w-20 truncate">${gameState.whiteName}</div>
              <div class="flex-1 flex flex-wrap gap-1 justify-end">${renderCaptured('B')}</div>
            </div>
            <div class="flex items-center justify-between bg-[#0a0a0a] border border-neutral-800 rounded-lg p-3">
              <div class="text-[10px] lg:text-[12px] text-neutral-500 font-medium tracking-[0.15em] uppercase w-20 truncate">${gameState.redName}</div>
              <div class="flex-1 flex flex-wrap gap-1 justify-end">${renderCaptured('R')}</div>
            </div>
        </div>
      `;

      const controlPanelHTML = gameState.winner ? `
        <div class="flex-1 flex flex-col items-center justify-start pt-4 gap-5 w-full animate-fade-in pb-10 lg:pb-0">
          <button onclick="window.toggleRecord()" class="w-[220px] lg:w-[260px] py-4 lg:py-5 rounded-lg border border-neutral-800 text-white font-medium text-xs lg:text-[14px] tracking-[0.15em] uppercase hover:bg-neutral-900 transition-colors key-base">MATCH RECORD</button>
          <button onclick="window.openMenu()" class="w-[220px] lg:w-[260px] py-4 lg:py-5 rounded-lg bg-white text-black font-medium text-xs lg:text-[14px] tracking-[0.15em] uppercase hover:bg-neutral-200 transition-colors key-base">MAIN MENU 主選單</button>
        </div>
      ` : `<div class="flex-none bg-black pb-6 lg:pb-0">${capturedAreaHTML}</div>`;

      // 準備左上角嘅顯示字眼
      let modeDisplay = '';
      if (settings.mode === 'PvE') {
          if (settings.firstMove === 'PLAYER') modeDisplay = '先攻';
          else if (settings.firstMove === 'AI') modeDisplay = '後攻';
          else modeDisplay = gameState.startingTurn === 'R' ? '隨機 - 先攻' : '隨機 - 後攻';
      } else {
          modeDisplay = '雙人對戰';
      }

      let roundDisplay = '';
      const currentRound = Math.ceil(gameState.gameLog.length / 2) + 1;
      if (settings.mode === 'PvE') {
          let lvColorClass = 'text-white font-bold';
          if (settings.aiDifficulty >= 14) lvColorClass = 'text-purple-500 font-black tracking-widest drop-shadow-[0_0_8px_rgba(168,85,247,0.5)]';
          else if (settings.aiDifficulty > 10) lvColorClass = 'text-red-500 font-black tracking-widest';
          
          roundDisplay = `<span class="${lvColorClass}">LV.${settings.aiDifficulty}</span> <span class="mx-2 opacity-50">|</span> 回合 ${currentRound}`;
      } else {
          roundDisplay = `PVP <span class="mx-2 opacity-50">|</span> 回合 ${currentRound}`;
      }

      appDiv.innerHTML = `
        ${menuHTML}
        ${recordHTML}
        ${tossHTML}
        
        <div class="w-full h-full bg-black relative flex flex-col overflow-hidden">
          
          <header class="flex-none pt-6 pb-2 px-5 lg:px-12 flex items-start justify-between z-30 w-full shrink-0">
            <div class="flex items-start"><img src="./assets/Logo.svg" alt="CHESS" class="h-[19px] lg:h-[25px] object-contain opacity-90 icon-white"></div>
            <div class="flex items-start gap-5 lg:gap-8">
              <button onclick="window.openMenu()" ${gameState.isThinking || gameState.isAnimating || gameState.showCaptureEffect || gameState.isTossing ? 'disabled style="opacity:0.2"' : ''} class="flex items-start justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/setting.svg" alt="SET" class="h-[14px] lg:h-[18px] object-contain icon-white"></button>
              <button onclick="window.toggleRecord()" class="flex items-start justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/record.svg" alt="REC" class="h-[16px] lg:h-[22px] object-contain icon-white"></button>
              <button onclick="window.handleUndo()" ${historyStack.length === 0 || gameState.winner || gameState.isThinking || gameState.isAnimating || gameState.showCaptureEffect || gameState.isTossing ? 'disabled style="opacity:0.2"' : ''} class="flex items-start justify-center opacity-70 hover:opacity-100 transition-opacity key-base"><img src="./assets/back.svg" alt="UNDO" class="h-[14px] lg:h-[18px] object-contain icon-white"></button>
            </div>
          </header>

          <div class="absolute top-[60px] lg:top-[85px] left-5 lg:left-12 z-20 pointer-events-none">
            <div class="text-[10px] lg:text-[13px] text-neutral-400 font-medium tracking-[0.15em] leading-relaxed uppercase">
              中國象棋<br>
              ${modeDisplay}<br>
              ${roundDisplay}
            </div>
          </div>

          <main class="flex-1 w-full max-w-md lg:max-w-[1200px] mx-auto flex flex-col lg:flex-row min-h-0 relative z-10">
            <div class="flex-1 relative min-h-0 flex flex-col lg:justify-center lg:py-8 lg:pr-8">
              <div class="flex-1 flex items-center justify-center pb-2 lg:pb-0 w-full h-full min-h-0 overflow-visible pt-10 lg:pt-0">
                <svg viewBox="0 0 360 400" overflow="visible" class="w-full max-w-[400px] lg:max-w-[500px] h-auto max-h-[75vh] lg:h-full lg:max-h-[85vh] transition-transform origin-center">
                  ${generateBoardSVG()}
                </svg>
              </div>
            </div>

            <div class="flex-none lg:w-[480px] lg:h-full flex flex-col justify-end lg:justify-center bg-black z-10 relative">
              <div class="flex-none lg:mb-4">
                <div class="mt-4 mb-4 px-4 lg:px-6 h-12">${statusBannerHTML}</div>
              </div>
              <div class="flex-none">
                ${controlPanelHTML}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    window.onload = () => { 
      loadHistory();
      if (!pendingSettings) pendingSettings = cloneState(settings);
      render(); 
    };
  </script>
</body>
</html>
