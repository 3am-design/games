<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 提升 iOS 網頁體驗 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <title>Games</title>
  
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }
    }
  </script>
  
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { 
      0% { opacity: 0; transform: translateY(15px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
    
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .stagger-6 { animation-delay: 0.6s; }
    .stagger-7 { animation-delay: 0.7s; }

    html, body { 
      background-color: #000000; 
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      height: 100%;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch; 
    }

    /* 卡片懸浮光效 */
    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .game-card:not(.disabled):hover::before { opacity: 1; }
    .font-tc { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-black selection:bg-white/30 flex flex-col items-center min-h-screen overflow-x-hidden relative">

        <!-- Game 1: 中國象棋 -->

                <div class="absolute inset-0 flex flex-col justify-evenly py-2 lg:py-3"><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div><div class="w-full h-[1px] bg-neutral-800"></div></div>
                <div class="absolute inset-0 flex justify-evenly px-2 lg:px-3"><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div></div>
                
                <!-- 棋子 (Karina 新增：五連勝發光連線) -->

                <div class="absolute w-[12px] h-[12px] lg:w-[16px] lg:h-[16px] bg-[#111] rounded-full border-2 border-amber-500 translate-x-[12px] translate-y-[12px] lg:translate-x-[15px] lg:translate-y-[15px] z-10 transition-colors duration-300 group-hover:bg-amber-900/40"></div>

        <!-- Game 4: 四子棋 (Connect Four) -->

                    <div class="w-full aspect-square bg-red-500 rounded-full shadow-[0_0_5px_rgba(239,68,68,0.5)]"></div>

        <!-- Game 5: 鬥獸棋 (Jungle Chess) -->

                <div class="absolute inset-0 flex justify-evenly px-1 lg:px-2"><div class="h-full w-[1px] bg-neutral-800"></div><div class="h-full w-[1px] bg-neutral-800"></div></div>
                
                <!-- 河流 (Rivers) -->

        <!-- Game 6: 數獨 (Sudoku) -->

            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-purple-900/40 rounded-xl overflow-hidden">

        <!-- Game 7: 2048 -->
        <a href="2048.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-5 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-pink-500 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

                    </div>

                    <!-- Row 0: Sliding 2s (向右滑動合併) -->
                    <!-- 被撞擊的 2 (Karina 優化：合併後顯示數字 4) -->
                    <div class="absolute top-0 left-[calc(25%+0.5px)] w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-950 border border-pink-700/50 rounded-[2px] flex items-center justify-center z-10 transition-colors duration-300 group-hover:bg-pink-700 group-hover:border-pink-400">
                        <span class="absolute text-pink-400 font-inter text-[8px] lg:text-[10px] font-bold group-hover:opacity-0 transition-opacity duration-300">2</span>
                        <span class="absolute text-pink-100 font-inter text-[8px] lg:text-[10px] font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300">4</span>
                    </div>
                    <!-- 負責滑動的 2 -->
                    <div class="absolute top-0 left-0 group-hover:left-[calc(25%+0.5px)] group-hover:opacity-0 w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-900 border border-pink-500 rounded-[2px] flex items-center justify-center z-20 transition-all duration-500 shadow-[0_0_5px_rgba(244,114,182,0.3)]">
                        <span class="text-pink-200 font-inter text-[8px] lg:text-[10px] font-bold">2</span>
                    </div>

                    <!-- Row 2&3: Sliding 8s (向上滑動合併) -->
                    <!-- 被撞擊的 8 (Karina 優化：合併後顯示數字 16) -->
                    <div class="absolute top-[calc(50%+1px)] left-[calc(50%+1px)] w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-800 border border-pink-400 rounded-[2px] flex items-center justify-center z-10 transition-colors duration-300 group-hover:bg-pink-600 group-hover:border-pink-300 group-hover:shadow-[0_0_8px_rgba(236,72,153,0.5)] delay-100">
                        <span class="absolute text-pink-200 font-inter text-[8px] lg:text-[10px] font-bold group-hover:opacity-0 transition-opacity duration-300 delay-100">8</span>
                        <span class="absolute text-white font-inter text-[8px] lg:text-[10px] font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300 delay-100">16</span>
                    </div>
                    <!-- 負責滑動的 8 -->
                    <div class="absolute top-[calc(75%+1.5px)] group-hover:top-[calc(50%+1px)] left-[calc(50%+1px)] group-hover:opacity-0 w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-800 border border-pink-400 rounded-[2px] flex items-center justify-center z-20 transition-all duration-500 delay-100">
                        <span class="text-pink-200 font-inter text-[8px] lg:text-[10px] font-bold">8</span>
                    </div>

                    <!-- 靜態點綴磚塊 -->
                    <div class="absolute top-[calc(25%+0.5px)] left-[calc(75%+1.5px)] w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-900 border border-pink-700/50 rounded-[2px] flex items-center justify-center z-10">
                        <span class="text-pink-500 font-inter text-[8px] lg:text-[10px] font-bold">4</span>
                    </div>

                    <!-- 終極 2048 磚塊 -->
                    <div class="absolute top-[calc(75%+1.5px)] left-[calc(75%+1.5px)] w-[calc(25%-1.5px)] h-[calc(25%-1.5px)] bg-pink-500 rounded-[2px] flex items-center justify-center z-10 shadow-[0_0_10px_rgba(236,72,153,0.8)] group-hover:scale-[1.15] transition-transform duration-300 delay-200 origin-center">
                        <span class="text-white font-inter text-[5px] lg:text-[6px] font-black tracking-tighter">2048</span>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">2048</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Number Puzzle</span>
            </div>
        </a>

        <!-- Game 8: 分數狙擊 (Carrom) -->
        <a href="carrom.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-6 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#322EFF] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-[#322EFF]/40 rounded-xl overflow-hidden">
                <!-- Zoom-in 棋盤角落線條 (斜線點綴) -->
                <div class="absolute top-[15%] right-[-15%] w-[130%] h-[1px] bg-[#322EFF]/30 rotate-45"></div>
                <div class="absolute top-[25%] right-[-15%] w-[130%] h-[1px] bg-[#322EFF]/10 rotate-45"></div>
                
                <!-- 右上角特寫球洞 (Pocket) -->
                <div class="absolute top-[-8px] right-[-8px] w-[28px] h-[28px] lg:w-[36px] lg:h-[36px] bg-[#050505] rounded-full border-[2px] border-[#322EFF]/60 shadow-[inset_0_4px_8px_rgba(0,0,0,0.8)] z-0"></div>

                <!-- 靜態干擾棋子 (增加真實感) -->
                <div class="absolute w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] bg-neutral-600 rounded-full bottom-[20%] right-[25%] border border-neutral-500"></div>

                <!-- 目標紅棋 (被擊中後入右上角洞) -->
                <div class="absolute w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] bg-rose-500 rounded-full border border-rose-400 shadow-[0_0_8px_rgba(244,63,94,0.6)] top-[35%] right-[35%] z-10 transition-all duration-300 group-hover:top-[2px] group-hover:right-[2px] group-hover:scale-50 group-hover:opacity-0 delay-100"></div>

                <!-- 擊球母子 (Striker，向右上角滑動擊波) -->
                <div class="absolute w-[14px] h-[14px] lg:w-[20px] lg:h-[20px] bg-[#322EFF] rounded-full border-[2px] border-white/60 shadow-[0_0_10px_rgba(50,46,255,0.8)] bottom-[15%] left-[15%] z-20 transition-all duration-300 group-hover:bottom-[50%] group-hover:left-[50%] group-hover:-translate-x-[2px] group-hover:translate-y-[2px]"></div>
            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">分數狙擊</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Carrom</span>
            </div>
        </a>

        <!-- Karina 新增 Game 9: 泡泡消除 (Bubble Puzzle) -->
        <a href="puzzle.html" class="game-card relative group bg-[#0d0d0d] border border-neutral-800 hover:border-neutral-400 rounded-2xl p-6 lg:p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:-translate-y-1 cursor-pointer animate-fade-in stagger-7 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="w-[60px] h-[60px] lg:w-[80px] lg:h-[80px] relative flex items-center justify-center group-hover:scale-110 transition-transform duration-500 bg-[#111] border-2 border-neutral-800 rounded-xl overflow-hidden">
                
                <!-- 泡泡網格 (Hexagonal Grid) -->
                <!-- R0 (最頂) -->
                <div class="absolute top-[10%] left-[15%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-emerald-500 shadow-[0_0_4px_rgba(16,185,129,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-emerald-500 rounded-full"></div></div>
                <div class="absolute top-[10%] left-[35%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-blue-500 shadow-[0_0_4px_rgba(59,130,246,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-blue-500 rounded-full"></div></div>
                <div class="absolute top-[10%] left-[55%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-amber-500 shadow-[0_0_4px_rgba(245,158,11,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-amber-500 rounded-full"></div></div>
                <div class="absolute top-[10%] left-[75%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-purple-500 shadow-[0_0_4px_rgba(168,85,247,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-purple-500 rounded-full"></div></div>

                <!-- R1 (第二排交錯) -->
                <div class="absolute top-[24%] left-[25%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-purple-500 shadow-[0_0_4px_rgba(168,85,247,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-purple-500 rounded-full"></div></div>
                <div class="absolute top-[24%] left-[45%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-rose-500 shadow-[0_0_4px_rgba(244,63,94,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-rose-500 rounded-full"></div></div>
                <div class="absolute top-[24%] left-[65%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-emerald-500 shadow-[0_0_4px_rgba(16,185,129,0.6)] flex justify-center items-center"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-emerald-500 rounded-full"></div></div>

                <!-- R2 (第三排交錯) -->
                <!-- 這是藍色目標泡泡 (Target) - 被擊中後消除 -->
                <div class="absolute top-[38%] left-[35%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-blue-500 shadow-[0_0_4px_rgba(59,130,246,0.6)] flex justify-center items-center z-10 transition-all duration-300 group-hover:scale-[2] group-hover:opacity-0 delay-200"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-blue-500 rounded-full"></div></div>
                <!-- 旁邊的黃色泡泡，受牽連掉落 -->
                <div class="absolute top-[38%] left-[55%] -translate-x-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-amber-500 shadow-[0_0_4px_rgba(245,158,11,0.6)] flex justify-center items-center transition-all duration-500 group-hover:translate-y-[20px] group-hover:opacity-0 delay-300"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-amber-500 rounded-full"></div></div>

                <!-- Danger Zone 虛線 -->
                <div class="absolute top-[70%] w-full border-b border-dashed border-red-500/40"></div>

                <!-- Aiming Line (瞄準線) -->
                <!-- 利用 border-l 畫直線並旋轉 20 度精準對準左上角目標 -->
                <div class="absolute top-[43%] left-[50%] h-[42%] border-l-[1.5px] border-dashed border-neutral-400/60 origin-bottom -rotate-[20deg]"></div>

                <!-- Shooter Base (發射台) -->
                <div class="absolute top-[85%] left-[50%] -translate-x-1/2 -translate-y-1/2 w-[18px] h-[18px] lg:w-[24px] lg:h-[24px] rounded-full border border-neutral-600/50 bg-[#111] z-20"></div>

                <!-- Bullet (發射的藍色泡泡) -->
                <div class="absolute top-[85%] left-[50%] -translate-x-1/2 -translate-y-1/2 w-[10px] h-[10px] lg:w-[14px] lg:h-[14px] rounded-full border-[1.5px] lg:border-[2px] border-blue-500 shadow-[0_0_6px_rgba(59,130,246,0.8)] bg-[#111] flex justify-center items-center z-30 transition-all duration-300 group-hover:top-[38%] group-hover:left-[35%] group-hover:opacity-0 ease-in"><div class="w-[2px] h-[2px] lg:w-[3px] lg:h-[3px] bg-blue-500 rounded-full"></div></div>

            </div>
            
            <div class="flex flex-col items-center mt-2">
                <span class="text-white font-tc font-bold text-[16px] lg:text-[18px] tracking-wider">泡泡拼圖</span>
                <span class="text-neutral-500 text-[9px] lg:text-[11px] tracking-[0.2em] uppercase mt-1">Bubble Puzzle</span>
            </div>
        </a>

    </div>
  </main>
