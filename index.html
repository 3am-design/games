<!DOCTYPE html>

  <!-- 提升 iOS 網頁體驗 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- 引入 Google Fonts -->

  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true }
    }
  </script>
  
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn { 
      0% { opacity: 0; transform: translateY(15px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
    
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .stagger-6 { animation-delay: 0.6s; }
    .stagger-7 { animation-delay: 0.7s; }
    .stagger-8 { animation-delay: 0.8s; }
    .stagger-9 { animation-delay: 0.9s; }
    .stagger-10 { animation-delay: 1.0s; }
    .stagger-11 { animation-delay: 1.1s; }
    .stagger-12 { animation-delay: 1.2s; }
    .stagger-13 { animation-delay: 1.3s; }

    html, body { 
      background-color: #000000; 
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      height: 100%;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch; 
    }

    /* 卡片懸浮光效 */
    .game-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .game-card:not(.disabled):hover::before,
    .game-card:not(.disabled).is-clicked::before { opacity: 1; }
    .font-tc { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>

  <!-- 處理 Mobile 點擊觸發 Hover 動畫 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 檢測是否為觸控設備 (Mobile/Tablet)
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        if (isTouchDevice) {
            document.querySelectorAll('*').forEach(el => {
                const classes = Array.from(el.classList);
                classes.forEach(cls => {
                    if (cls.startsWith('group-hover:')) {
                        el.classList.add(cls.replace('group-hover:', 'group-[.is-clicked]:'));
                    } else if (cls.startsWith('hover:')) {
                        el.classList.add(cls.replace('hover:', '[&.is-clicked]:'));
                    }
                });
            });

            document.querySelectorAll('.game-card:not(.disabled)').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    const targetUrl = this.getAttribute('href');
                    
                    this.classList.add('is-clicked');
                    
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 650); 
                });
            });

            window.addEventListener('pageshow', function(e) {
                if (e.persisted) {
                    document.querySelectorAll('.game-card').forEach(card => card.classList.remove('is-clicked'));
                }
            });
        }
    });
  </script>
